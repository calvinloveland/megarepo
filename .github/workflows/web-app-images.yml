name: Web app container builds

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'active/web-apps/parambulator/**'
      - 'active/web-apps/momos/**'
      - 'active/web-apps/sub-day-generator/**'
      - 'active/web-apps/shared/**'
      - '.github/workflows/web-app-images.yml'
  pull_request:
    paths:
      - 'active/web-apps/parambulator/**'
      - 'active/web-apps/momos/**'
      - 'active/web-apps/sub-day-generator/**'
      - 'active/web-apps/shared/**'
      - '.github/workflows/web-app-images.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: parambulator
            dockerfile: active/web-apps/parambulator/Dockerfile
          - name: cozi
            dockerfile: active/web-apps/momos/Dockerfile
          - name: sub-day-generator
            dockerfile: active/web-apps/sub-day-generator/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build ${{ matrix.name }} image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./active/web-apps
          file: ./${{ matrix.dockerfile }}
          push: false
          tags: ${{ matrix.name }}:ci-check
