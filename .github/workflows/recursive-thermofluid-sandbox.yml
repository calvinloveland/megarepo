name: Recursive Thermofluid Sandbox

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'active/web-apps/recursive-thermofluid-sandbox/**'
      - '.github/workflows/recursive-thermofluid-sandbox.yml'
  pull_request:
    paths:
      - 'active/web-apps/recursive-thermofluid-sandbox/**'
      - '.github/workflows/recursive-thermofluid-sandbox.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: active/web-apps/recursive-thermofluid-sandbox
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: active/web-apps/recursive-thermofluid-sandbox/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Node syntax check
        run: node --check app.js && node --check server.mjs && node --check sim-core.mjs

      - name: Unit and smoke tests
        run: npm test

      - name: Start server for E2E tests
        run: |
          node server.mjs &
          SERVER_PID=$!
          echo "SERVER_PID=$SERVER_PID" >> $GITHUB_ENV
          sleep 1

      - name: Smoke tests
        run: bash tests/smoke-test.sh

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Playwright E2E tests
        run: npm run test:e2e

      - name: Stop server
        if: always()
        run: kill ${{ env.SERVER_PID }} || true
