name: Vernissage container

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'active/web-apps/vernissage/**'
      - '.github/workflows/vernissage-container.yml'
  pull_request:
    paths:
      - 'active/web-apps/vernissage/**'
      - '.github/workflows/vernissage-container.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: active/web-apps/vernissage
    env:
      NEXTAUTH_SECRET: ci-nextauth-secret
      NEXTAUTH_URL: http://127.0.0.1:3104
      FEEDBACK_DATABASE_URL: file:./runtime/feedback.db
      FEEDBACK_ADMIN_USERNAME: admin
      FEEDBACK_ADMIN_PASSWORD: ci-feedback-password
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: active/web-apps/vernissage/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Playwright smoke tests
        run: npm run test:e2e

  build-image:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ./active/web-apps/vernissage
          file: ./active/web-apps/vernissage/Dockerfile
          push: false
          tags: vernissage:ci-check
          cache-from: type=gha
          cache-to: type=gha,mode=max
