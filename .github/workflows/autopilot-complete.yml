name: pi-autopilot-complete

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'active/personal/calnix/pi-packages/pi-autopilot-complete/**'
      - '.github/workflows/autopilot-complete.yml'
  pull_request:
    paths:
      - 'active/personal/calnix/pi-packages/pi-autopilot-complete/**'
      - '.github/workflows/autopilot-complete.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PI_CACHE_DIR: /tmp/pi-cache

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: active/personal/calnix/pi-packages/pi-autopilot-complete
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: active/personal/calnix/pi-packages/pi-autopilot-complete/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Install pi
        run: |
          npm install -g @earendil-works/pi-coding-agent --ignore-scripts
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Live super-autopilot smoke test
        run: |
          bash tests/super-autopilot-smoke.sh opencode-go/kimi-k2.5 --min-cycles 3
        env:
          SMOKE_TIMEOUT: 120
