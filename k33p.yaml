# k33p.yaml — megarepo project with auto-commit daemon for the whole repo
project: megarepo
type: monorepo
description: Consolidated monorepo for active projects, shared tooling, and docs

channels:
  src:
    type: source
    transport: git+https://github.com/calvinloveland/megarepo
    visibility: public
    history: full

views:
  default:
    src: { at: "./" }
  developer:
    extends: default
    src: { at: "./", history: shallow }

roles:
  developer:   { view: developer }
  maintainer:  { view: default, publish: [src] }

daemon:
  auto_commit:
    enabled: true
    debounce: 30s
    paths:
      - ./
    ignore:
      # Build / dependency directories (many files, not source)
      - node_modules/
      - .venv/
      - venv/
      - dist/
      - build/
      - out/
      - ".cache/"
      - site/
      - ".docs-site/"
      # Python caches
      - "*.pyc"
      - __pycache__/
      - ".pytest_cache/"
      - ".ruff_cache/"
      - "*.egg-info/"
      # full-auto-de-pdf generated benchmark/OCR data (large, not source)
      - benchmark-corpus*
      - ocr-cache-test*
      - ocr-work
      - "cache"      # full-auto-de-pdf/data/cache/ generated corpus cache
      # Editor temp files
      - "*.tmp"
      - "*.swp"
      # k33p store
      - ".k33p/"
    message: "k33p auto: changes in {files}"
    push_after: 5m
