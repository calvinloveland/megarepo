# k33p.yaml — megarepo project with auto-commit daemon for the whole repo
project: megarepo
type: monorepo
description: Consolidated monorepo for active projects, shared tooling, and docs

channels:
  src:
    type: source
    transport: git+https://github.com/calvinloveland/megarepo
    visibility: public
    history: full

  # Encrypted private content. Secrets lifted out of tracked source by the
  # pre-commit gitleaks hook (scripts/k33p_secret_lift.py) are age-encrypted
  # to the recipient in .k33p/age-recipient.txt and stored as `secret`-kind
  # blobs in .k33p/store/. The private identity lives off-repo at
  # ~/.config/k33p/age/megarepo-identity.txt.
  private:
    type: secrets
    transport: k33p+https://secrets.calvinloveland.dev/megarepo
    encryption: age
    recipients:
      - "age1s3pzt5ltez9xhr6zjk7f0d3aaxm6mk3dwm789ht6k9k7trsntp9sadevxg"
    history: none
    scope: monorepo

views:
  default:
    src: { at: "./" }
  developer:
    extends: default
    src: { at: "./", history: shallow }

roles:
  developer:   { view: developer }
  maintainer:  { view: default, publish: [src] }

daemon:
  auto_commit:
    enabled: true
    debounce: 30s
    paths:
      - ./
    ignore:
      # Daemon-specific overrides (most patterns come from .gitignore)
      - "*.tmp"
      - "*.swp"
      - ".ruff_cache/"
      - "*.egg-info/"
    message: "k33p auto: changes in {files}"
    push_after: 5m
