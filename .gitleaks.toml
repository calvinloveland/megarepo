# Repo-local gitleaks config.
#
# Extends a hardened vendoring of the upstream gitleaks default
# (gitleaks.default.toml). That file is NOT pristine: literal example-secret
# allowlist entries shipped by upstream (e.g. the ~16 AIzaSy... keys on the
# `gcp-api-key` rule, which created a silent-miss hole for bare occurrences)
# have been stripped — see the `# HARDENED:` comments in that file.
# Pattern/path-based allowlists are retained. To re-vendor from a new gitleaks
# release, copy upstream `etc/gitleaks.toml` over this file and re-apply the
# HARDENED strips (search for `# HARDENED:`).
#
# Why a separate file: the nixpkgs `gitleaks` binary ships with an empty
# embedded default config, so a repo-local config referenced via `--config`
# (or discovered as `.gitleaks.toml`) is required for any rules to fire.

title = "megarepo gitleaks config"

[extend]
path = "gitleaks.default.toml"

[allowlist]
description = "megarepo-specific allowlists"
paths = [
    # The vendored config itself is full of secret-looking regexes/examples.
    '''gitleaks\.default\.toml''',
    '''\.gitleaks\.toml''',
    # k33p example manifests declare channel types/transport strings, not real
    # secrets.
    '''active/dev-tools/k33p/examples/.*k33p\.yaml$''',
    # k33p tests use placeholder age keys and ref strings.
    '''active/dev-tools/k33p/tests/.*''',
    # Test fixtures contain field names like api_card_id whose VALUES are
    # Pokemon card IDs (e.g. ju-60-unlimited), not secrets — they trip the
    # generic-api-key keyword rule. Allowlist the whole fixtures dir.
    '''active/dev-tools/pokemon-binder-scanner/tests/fixtures/.*''',
    # Example/template configs use placeholder secrets (e.g. a Slack webhook
    # of all X/Y/Z). They are documentation, not live credentials.
    '''active/dev-tools/full-auto-ci/config\.example\.yml$''',
    # Docs that discuss secret patterns.
    '''docs/.*''',
    # Lift manifest stores age-encrypted ciphertext, never plaintext secrets.
    '''\.k33p/secrets-manifest\.json$''',
]
regex = [
    # ESP-IDF ships this as the *default* OpenThread demo network master key in
    # generated sdkconfig files; it is a public upstream constant, not a
    # credential. Allowlist the exact assignment so the pre-commit hook does
    # not rewrite sdkconfig on every change.
    '''CONFIG_OPENTHREAD_NETWORK_MASTERKEY="00112233445566778899aabbccddeeff"''',
    # Vernissage README documents the localhost-only default admin login for
    # the local dev server (127.0.0.1); it is a sandbox default, not a live
    # credential.
    '''curl http://127\.0\.0\.1:3002/.*admin:secret''',
]

# ── Repo-local rules ───────────────────────────────────────────────────────
# Patterns the vendored upstream config does not cover.
#
# Why these exist: a live OpenCode Go key (`oc_sk_…`) was pasted into
# `opencodekey.txt` at the repo root. Upstream gitleaks has no rule for that
# prefix, and `generic-api-key` requires a `key = value`-ish assignment context
# that a single bare token on its own line does not provide — so the pre-commit
# hook found nothing and the k33p auto-commit daemon pushed the key to the
# public repo. The key had to be rotated. Both the prefix and the
# "bare token in a credential-shaped file" shape are covered below.
[[rules]]
id = "opencode-api-key"
description = "Detected an OpenCode / OpenCode Go API key (`oc_sk_` prefix)."
regex = '''\boc_sk_[A-Za-z0-9_-]{20,}\b'''
keywords = ["oc_sk_"]

[[rules]]
id = "bare-token-in-credential-file"
description = "Detected a bare API token sitting alone in a credential-shaped file (no key=value context)."
regex = '''(?i)^[\s"']*(?:oc_sk_|sk-or-v1-|sk-[A-Za-z0-9]{20,}|gh[pousr]_[A-Za-z0-9]{20,}|xox[baprs]-[A-Za-z0-9-]{10,}|AIza[\w-]{35})[A-Za-z0-9_.-]*[\s"']*$'''
path = '''(?i)(^|/)[^/]*(?:api[_-]?key|apikey|opencodekey|credentials?|secrets?|token|auth)[^/]*\.(txt|log|env|json|ya?ml|csv)$'''
keywords = ["oc_sk_", "sk-", "ghp_", "gho_", "xox", "aiza"]
