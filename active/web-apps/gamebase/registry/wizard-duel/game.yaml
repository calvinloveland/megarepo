slug: wizard-duel
title: Wizard Duel
description: A turn-based wizard duel built from the Wizard Fight spell DSL. Ramp
  mana, summon lane minions, and burn your rival down with bolts, frost, shields,
  and healing. Play vs AI, a local two-player opponent, or online. Win = 3 points,
  draw = 1.
