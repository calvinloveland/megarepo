slug: conway-war
title: Conway War
description: Conway's Game of Life meets territorial warfare. Seed cells around your
  immortal base, spend energy to claim ground, then advance the automaton — Life
  birth/survival resolves, cells touching enemies die in combat, and territory flips
  to the local majority. Beat a simple AI or a local two-player opponent. Win = 3
  points, draw = 1.
