<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Snake — Gamebase</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="game">
    <header class="topbar">
      <h1>Snake</h1>
      <span class="tag" id="tag">···</span>
    </header>

    <div class="hud">
      <span class="hud-item">Score <b id="score">0</b></span>
      <span class="hud-item">Length <b id="length">3</b></span>
      <span class="hud-item">Speed <b id="speed">1</b></span>
      <span class="hud-item">Best <b id="best">0</b></span>
    </div>

    <div class="board-wrap">
      <canvas id="canvas" width="480" height="480" aria-label="Snake board"></canvas>
      <div class="overlay" id="overlay" hidden>
        <div class="overlay-card">
          <h2 id="overlay-title">Game over</h2>
          <p id="overlay-body"></p>
          <button id="overlay-btn" class="btn primary">New game</button>
        </div>
      </div>
    </div>

    <div class="controls">
      <button id="new-game" class="btn primary">New game</button>
      <button id="pause" class="btn">Pause</button>
    </div>
    <p class="hint">Arrow keys or WASD to steer. On touch, swipe the board. Space pauses.</p>
  </main>
  <script src="/sdk/gamebase.js"></script>
  <script src="game.js"></script>
</body>
</html>
