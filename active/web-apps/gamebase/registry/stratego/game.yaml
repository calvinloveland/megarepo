slug: stratego
title: Stratego
description: >-
  Faithful full 10x10 Stratego against a heuristic AI with hidden information:
  you never see the AI's ranks until a battle reveals them. Standard 40-piece
  armies (Marshal 10 down to Scout 2, Spy 1, 6 Bombs, 1 Flag), two 2x2 lakes,
  orthogonal movement, Scouts as long-range rooks, Miners defusing Bombs, the
  Spy killing the Marshal, and flag capture or immobilisation as win
  conditions. Simplifications: pieces stay face-up once a battle reveals them
  (a memory aid rather than physical play), and the competitive two-square and
  no-chase anti-stalling rules are omitted (a 300-ply no-battle draw ends dead
  games).
