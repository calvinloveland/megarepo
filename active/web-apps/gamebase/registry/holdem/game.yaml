slug: holdem
title: Hold 'Em Together
description: >-
  Texas Hold'em with real blinds, betting rounds, side pots, all-ins and a
  faithful best-five-of-seven hand evaluator. Play a 2-6 seat table against
  bots, or go online for a 2-6 player peer-to-peer table where the host
  client runs the dealer. No game server: peers talk directly, hole cards are
  sent privately to each player, and the host role hands off seamlessly to the
  next seated player if the host leaves.
