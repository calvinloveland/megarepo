<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Chess — Gamebase</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="game">
    <header class="topbar">
      <h1>Chess</h1>
      <span class="tag" id="tag">···</span>
    </header>

    <div class="status-row">
      <span class="status" id="status" aria-live="polite">Loading…</span>
      <span class="captured" id="captured-black" aria-label="Black captured"></span>
      <span class="captured" id="captured-white" aria-label="White captured"></span>
    </div>

    <div class="board-wrap">
      <div class="board" id="board" role="grid" aria-label="Chess board"></div>
      <div class="promo" id="promo" hidden>
        <div class="promo-card">
          <p>Promote to</p>
          <div class="promo-options" id="promo-options"></div>
        </div>
      </div>
      <div class="overlay" id="overlay" hidden>
        <div class="overlay-card">
          <h2 id="overlay-title">Game over</h2>
          <p id="overlay-body"></p>
          <button id="overlay-btn" class="btn primary">New game</button>
        </div>
      </div>
    </div>

    <div class="coords" aria-hidden="true">
      <span>a b c d e f g h</span>
    </div>

    <div class="controls">
      <button id="new-game" class="btn primary">New game</button>
      <button id="mode" class="btn">Mode: vs AI</button>
      <button id="side" class="btn" hidden>Play: White</button>
      <button id="undo" class="btn">Undo</button>
    </div>
    <p class="hint">Click a piece, then a highlighted square. Keyboard: arrow keys + Enter.</p>
  </main>
  <script src="/sdk/gamebase.js"></script>
  <script src="game.js"></script>
</body>
</html>
