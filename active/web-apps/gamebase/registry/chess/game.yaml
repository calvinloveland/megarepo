slug: chess
title: Chess
description: >-
  Full standard chess against a heuristic AI (alpha-beta search, depth 3) or a
  local two-player opponent. Supports castling, en passant, promotion with a
  chooser, check, checkmate, stalemate, the fifty-move rule, threefold
  repetition and insufficient-material draws. Win = 3 points, draw = 1.
author: gamebase
version: 1.0.0
