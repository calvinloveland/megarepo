slug: checkers
title: Checkers
description: Standard American checkers (English draughts) against a heuristic AI
  or a local two-player opponent. Forced captures, multi-jump chains, crowning kings,
  the forty-move rule, threefold repetition, and no-piece/blocked losses are all enforced.
  Win = 3 points, draw = 1.
