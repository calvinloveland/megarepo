slug: reversi
title: Reversi
description: Classic Othello/Reversi on an 8x8 board. All eight flip directions are
  checked, players pass automatically when they have no move, and the game ends when
  neither side can move. Play a positional minimax AI or a local two-player opponent.
  Win = 3 points, draw = 1.
