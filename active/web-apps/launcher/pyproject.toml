[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "megarepo-launcher"
version = "0.1.0"
description = "Dashboard to start, stop, and browse every web app in the megarepo"
requires-python = ">=3.8"
dependencies = [
    "Flask>=2.3",
    "PyYAML>=5.4",
]

[project.scripts]
launcher = "app:main"
