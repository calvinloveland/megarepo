<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Background: dark slate to match launcher -->
  <rect width="64" height="64" rx="10" fill="#0a0e17"/>
  <!-- Container card (blue, like Flask apps in the launcher) -->
  <rect x="12" y="20" width="40" height="28" rx="2" fill="#1a4a7a" stroke="#000" stroke-width="2"/>
  <!-- Corrugated metal texture -->
  <g stroke="#000" stroke-opacity="0.25" stroke-width="0.6">
    <line x1="12" y1="24" x2="52" y2="24"/>
    <line x1="12" y1="28" x2="52" y2="28"/>
    <line x1="12" y1="32" x2="52" y2="32"/>
    <line x1="12" y1="36" x2="52" y2="36"/>
    <line x1="12" y1="40" x2="52" y2="40"/>
    <line x1="12" y1="44" x2="52" y2="44"/>
  </g>
  <!-- Corner brackets -->
  <g stroke="#fff" stroke-opacity="0.5" stroke-width="1.5" fill="none">
    <polyline points="16,24 16,20 20,20"/>
    <polyline points="44,20 48,20 48,24"/>
    <polyline points="16,44 16,48 20,48"/>
    <polyline points="44,48 48,48 48,44"/>
  </g>
  <!-- Monogram S (for shsw) in the center -->
  <text x="32" y="40" text-anchor="middle"
        font-family="Courier New, monospace" font-weight="bold"
        font-size="16" fill="#fff">S</text>
  <!-- Green status dot in the top-right corner (online indicator) -->
  <circle cx="50" cy="14" r="3" fill="#4ade80"/>
</svg>
