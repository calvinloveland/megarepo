<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>shsw.dev — Megarepo Terminal</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Courier New', 'SF Mono', 'Consolas', monospace;
      background: #0a0e17; min-height: 100vh; overflow-x: hidden;
      color: #e2e8f0;
    }

    /* ═══ TABS ═══ */
    .top-bar {
      display: flex; align-items: center; gap: 16px;
      padding: 16px 24px 8px;
      flex-wrap: wrap;
      position: relative; z-index: 100;
    }
    .top-bar h1 {
      font-size: 22px; font-weight: 700; letter-spacing: 3px;
      text-transform: uppercase; color: rgba(255,255,255,0.9);
    }
    .top-bar .docs-link {
      font-size: 11px; color: rgba(255,255,255,0.4);
      text-decoration: none; letter-spacing: 1px;
      transition: color 0.15s;
    }
    .top-bar .docs-link:hover { color: #4ade80; }

    .tab-bar {
      display: flex; gap: 24px;
      padding: 0 24px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      position: relative; z-index: 100;
    }
    .tab-btn {
      font-family: 'Courier New', monospace;
      font-size: 11px; font-weight: 600; letter-spacing: 2px;
      text-transform: uppercase;
      padding: 10px 4px 8px;
      background: none; border: none;
      color: rgba(255,255,255,0.3);
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s;
      border-bottom: 2px solid transparent;
    }
    .tab-btn:hover { color: rgba(255,255,255,0.6); }
    .tab-btn.active { color: #4ade80; border-bottom-color: #4ade80; }

    .tab-content { display: block; }
    .tab-content.hidden { display: none; }

    /* ═══ SCENE BASE ═══ */
    .scene-wrap {
      position: relative;
      min-height: calc(100vh - 100px);
      overflow: hidden;
      max-width: 100vw;
    }
    body {
      overflow-x: hidden;
    }
    .scene-canvas {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 1;
    }
    .scene-bg {
      position: absolute; inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    /* Ship scene */
    .scene-ship .scene-bg {
      background: linear-gradient(to bottom, #0a1628 0%, #0d2b4e 25%, #0f3b5e 45%, #0a2a45 65%, #061828 100%);
    }
    .scene-ship .scene-bg::before {
      content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 40%;
      background: repeating-linear-gradient(100deg, transparent 0, transparent 60px,
        rgba(255,255,255,0.025) 60px, rgba(255,255,255,0.025) 62px, transparent 62px, transparent 120px);
      animation: waveMove 8s linear infinite;
    }
    .scene-ship .scene-bg::after {
      content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 40%;
      background: repeating-linear-gradient(130deg, transparent 0, transparent 90px,
        rgba(255,255,255,0.015) 90px, rgba(255,255,255,0.015) 92px, transparent 92px, transparent 180px);
      animation: waveMove 12s linear infinite reverse;
    }
    @keyframes waveMove { 0%{transform:translateX(0)} 100%{transform:translateX(120px)} }

    /* Train scene */
    .scene-train .scene-bg {
      background: linear-gradient(to bottom, #1a1a3a 0%, #2a2040 20%, #3a2a35 35%, #4a3a30 55%, #3a2a25 75%, #1a1a15 100%);
    }
    .scene-train .train-tracks {
      position: absolute; bottom: 15%; left: 0; right: 0; height: 4px;
      background: repeating-linear-gradient(90deg, #555 0, #555 25px, #777 25px, #777 27px, transparent 27px, transparent 35px);
      box-shadow: 0 6px 0 #444;
    }

    /* Crane scene */
    .scene-crane .scene-bg {
      background: linear-gradient(to bottom, #0d1b2a 0%, #1b2838 30%, #3a3020 55%, #2a2a1a 75%, #1a1a10 100%);
    }
    .scene-crane .crane-structure {
      position: absolute; top: 0; left: 50%; transform: translateX(-50%);
      width: 8px; height: 50%;
      background: linear-gradient(to bottom, rgba(150,150,160,0.3), rgba(100,100,110,0.1));
    }
    .scene-crane .crane-structure::before {
      content: ''; position: absolute; top: 0; width: 100px; height: 3px;
      left: -46px; background: rgba(150,150,160,0.25);
      box-shadow: 0 10px 0 rgba(150,150,160,0.15), 0 20px 0 rgba(150,150,160,0.1);
    }

    /* Depot scene */
    .scene-depot .scene-bg {
      background: linear-gradient(to bottom, #0a0e1a 0%, #121625 25%, #1a1a2e 50%, #161a2a 75%, #121625 100%);
    }
    .scene-depot .scene-bg::before {
      content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 50%;
      background: repeating-linear-gradient(90deg, transparent 0, transparent 50px,
        rgba(255,200,50,0.02) 50px, rgba(255,200,50,0.02) 52px, transparent 52px, transparent 100px);
    }

    /* ═══ CONTAINER CARDS (PHYSICS DOM OVERLAY) ═══ */
    #physics-container {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: 5;
      pointer-events: none;
    }
    .container-card {
      position: absolute;
      pointer-events: auto;
      /* Corrugated metal texture */
      background-image:
        repeating-linear-gradient(0deg, transparent 0, transparent 3px,
          rgba(0,0,0,0.07) 3px, rgba(0,0,0,0.07) 4px);
      background-color: var(--container-color, #2c5282);
      border: 2px solid rgba(0,0,0,0.3);
      border-radius: 4px;
      padding: 12px;
      width: 220px;
      min-height: 130px;
      display: flex; flex-direction: column;
      cursor: default;
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,0.08),
        inset 0 1px 0 rgba(255,255,255,0.12),
        0 4px 16px rgba(0,0,0,0.5);
      overflow: hidden;
      transform-origin: center center;
      transition: opacity 0.15s;
      will-change: transform;
    }
    .container-card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
      background: rgba(255,255,255,0.06);
    }
    .container-card::after {
      content: ''; position: absolute;
      top: -2px; left: -2px; right: -2px; bottom: -2px;
      border: 2px solid rgba(255,255,255,0.06);
      border-radius: 4px;
      pointer-events: none;
    }
    .container-card:hover {
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,0.12),
        0 8px 28px rgba(0,0,0,0.6);
    }

    .container-card .corner-tl,
    .container-card .corner-tr,
    .container-card .corner-bl,
    .container-card .corner-br {
      position: absolute; width: 6px; height: 6px;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 1px;
    }
    .container-card .corner-tl { top: 2px; left: 2px; border-right: none; border-bottom: none; }
    .container-card .corner-tr { top: 2px; right: 2px; border-left: none; border-bottom: none; }
    .container-card .corner-bl { bottom: 2px; left: 2px; border-right: none; border-top: none; }
    .container-card .corner-br { bottom: 2px; right: 2px; border-left: none; border-top: none; }

    .container-id {
      font-size: 10px; font-weight: 700; letter-spacing: 1.5px;
      color: rgba(255,255,255,0.8);
      background: rgba(0,0,0,0.2);
      padding: 2px 8px; border-radius: 2px;
      display: inline-block; margin-bottom: 4px;
      align-self: flex-start;
    }
    .container-content {
      position: relative; z-index: 2;
      flex: 1; display: flex; flex-direction: column;
    }
    .container-content .app-icon { font-size: 18px; margin-bottom: 2px; }
    .container-content h2 {
      font-size: 11px; font-weight: 700; color: rgba(255,255,255,0.95);
      margin-bottom: 1px;
      text-transform: uppercase; letter-spacing: 0.5px;
      line-height: 1.2;
    }
    .container-content .app-desc {
      font-size: 9px; color: rgba(255,255,255,0.55);
      line-height: 1.3; flex: 1;
    }
    .container-actions {
      display: flex; gap: 4px; margin-top: 4px;
    }
    .container-actions a, .container-actions button {
      font-family: 'Courier New', monospace;
      font-size: 11px; font-weight: 700; letter-spacing: 1px;
      padding: 8px 12px; border-radius: 2px;
      border: 1px solid rgba(255,255,255,0.15);
      cursor: pointer; transition: all 0.15s;
      text-decoration: none; text-transform: uppercase;
      flex: 1; text-align: center;
      background: rgba(255,255,255,0.1);
      color: white;
      min-height: 36px;
    }
    .container-actions .btn-open { background: rgba(255,255,255,0.15); }
    .container-actions .btn-open:hover { background: rgba(255,255,255,0.25); }
    .container-actions .btn-start {
      background: rgba(34,197,94,0.2);
      color: #4ade80; border-color: rgba(34,197,94,0.25);
    }
    .container-actions .btn-start:hover { background: rgba(34,197,94,0.35); }
    .container-actions .btn-start.loading {
      background: rgba(251,191,36,0.2); color: #fbbf24;
      border-color: rgba(251,191,36,0.25);
      animation: pulse 1s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }

    .status-dot-card {
      position: absolute; top: 6px; right: 6px; z-index: 5;
      width: 7px; height: 7px; border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.15);
    }
    .status-dot-card.running { background: #4ade80; box-shadow: 0 0 6px rgba(74,222,128,0.4); }
    .status-dot-card.stopped { background: #475569; }
    .status-dot-card.loading { background: #fbbf24; animation: pulse 1s ease-in-out infinite; }

    .container-color-blue   { --container-color: #1a4a7a; }
    .container-color-orange { --container-color: #8b4513; }
    .container-color-green  { --container-color: #2d5016; }
    .container-color-teal   { --container-color: #1a5a5a; }
    .container-color-gray   { --container-color: #3a3a4a; }

    /* ═══ SCENE CONTROLS ═══ */
    .scene-controls {
      position: relative; z-index: 20;
      display: flex; align-items: center; gap: 12px;
      padding: 8px 24px 4px;
      flex-wrap: wrap;
    }
    .scene-controls .scene-label {
      font-size: 10px; color: rgba(255,255,255,0.3);
      letter-spacing: 2px; text-transform: uppercase;
    }
    .scene-controls .scene-name {
      font-size: 12px; font-weight: 600; color: rgba(255,255,255,0.6);
    }
    .scene-controls .disturb-btn {
      font-family: 'Courier New', monospace;
      font-size: 10px; font-weight: 600; letter-spacing: 1px;
      text-transform: uppercase;
      padding: 6px 16px; border-radius: 2px;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.05);
      color: rgba(255,255,255,0.4);
      cursor: pointer; transition: all 0.15s;
    }
    .scene-controls .disturb-btn:hover {
      background: rgba(255,255,255,0.1);
      color: rgba(255,255,255,0.7);
    }
    .scene-controls .disturb-btn:disabled { opacity: 0.3; cursor: not-allowed; }
    .scene-controls .reroll-btn {
      font-family: 'Courier New', monospace;
      font-size: 10px; letter-spacing: 1px;
      padding: 6px 12px; border-radius: 2px;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.04);
      color: rgba(255,255,255,0.35);
      cursor: pointer; transition: all 0.15s;
      margin-left: auto;
    }
    .scene-controls .reroll-btn:hover { background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.6); }

    .gyro-indicator {
      font-size: 9px; letter-spacing: 1px; padding: 3px 10px; border-radius: 2px;
      border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.04);
      color: rgba(255,255,255,0.3);
    }
    .gyro-indicator.gyro-on { color: #4ade80; border-color: rgba(74,222,128,0.3); background: rgba(74,222,128,0.08); }
    .gyro-bar-bg {
      width: 50px; height: 4px; border-radius: 2px;
      background: rgba(255,255,255,0.08); overflow: hidden;
    }
    .gyro-bar {
      width: 0%; height: 100%; border-radius: 2px;
      transition: width 0.1s ease, background 0.2s ease;
    }

    .running-ticker {
      position: relative; z-index: 20;
      font-size: 12px; color: rgba(255,255,255,0.5);
      padding: 6px 24px;
      letter-spacing: 1px;
      background: rgba(255,255,255,0.03);
      border-top: 1px solid rgba(255,255,255,0.04);
      border-bottom: 1px solid rgba(255,255,255,0.04);
    }
    .running-ticker strong { color: #4ade80; font-weight: 700; }

    /* ═══ PROJECTS & DOCS TABS ═══ */
    .content-slate {
      background: #0a0e17;
      min-height: calc(100vh - 100px);
    }
    .content-slate .inner {
      max-width: 1200px; margin: 0 auto; padding: 24px;
    }
    .project-card {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 4px;
      padding: 20px;
      transition: background 0.15s, border-color 0.15s;
    }
    .project-card:hover { background: rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.1); }
    .project-card h3 { font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.9); margin-bottom: 4px; }
    .project-card p { font-size: 11px; color: rgba(255,255,255,0.5); }
    .project-card .meta { font-size: 10px; color: rgba(255,255,255,0.3); margin-top: 8px; display: flex; gap: 8px; flex-wrap: wrap; }
    .project-card .meta span { padding: 2px 8px; border-radius: 2px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06); }
    .project-card .meta .has-tests { background: rgba(74,222,128,0.08); border-color: rgba(74,222,128,0.15); color: #4ade80; }
    .project-card .actions { margin-top: 12px; display: flex; gap: 6px; }
    .project-card .actions button, .project-card .actions a {
      font-family: 'Courier New', monospace;
      font-size: 10px; letter-spacing: 1px;
      padding: 6px 14px; border-radius: 2px;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.04);
      color: rgba(255,255,255,0.5);
      cursor: pointer; transition: all 0.15s;
      text-decoration: none;
    }
    .project-card .actions button:hover, .project-card .actions a:hover { background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.8); }

    /* Grouped project list */
    .project-group {
      margin-bottom: 6px;
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 4px;
      overflow: hidden;
    }
    .group-header {
      width: 100%; text-align: left;
      padding: 10px 16px;
      font-family: 'Courier New', monospace;
      font-size: 12px; font-weight: 600;
      background: rgba(255,255,255,0.03);
      border: none; color: rgba(255,255,255,0.6);
      cursor: pointer;
      display: flex; align-items: center; gap: 10px;
      transition: background 0.1s, color 0.1s;
      letter-spacing: 0.5px;
    }
    .group-header:hover { background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.8); }
    .group-header .group-count {
      font-size: 10px; padding: 1px 8px;
      border-radius: 8px; background: rgba(255,255,255,0.06);
      color: rgba(255,255,255,0.4);
    }
    .group-header .group-arrow {
      margin-left: auto; font-size: 10px;
      transition: transform 0.2s ease;
    }
    .group-header.collapsed .group-arrow { transform: rotate(-90deg); }
    .group-body {
      display: block;
    }
    .group-body.hidden { display: none; }
    .compact-project {
      display: flex; align-items: center; gap: 10px;
      padding: 7px 16px 7px 20px;
      border-top: 1px solid rgba(255,255,255,0.04);
      transition: background 0.1s;
      font-size: 12px;
    }
    .compact-project:hover { background: rgba(255,255,255,0.03); }
    .compact-project .cp-icon { font-size: 16px; flex-shrink: 0; width: 20px; text-align: center; }
    .compact-project .cp-name {
      font-weight: 600; color: rgba(255,255,255,0.8);
      flex-shrink: 0; min-width: 140px;
    }
    .compact-project .cp-desc {
      color: rgba(255,255,255,0.4); font-size: 11px;
      flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .compact-project .cp-tag {
      font-size: 9px; padding: 1px 6px; border-radius: 3px;
      background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.3);
      border: 1px solid rgba(255,255,255,0.06); flex-shrink: 0;
    }
    .compact-project .cp-tag.tests { background: rgba(74,222,128,0.08); border-color: rgba(74,222,128,0.1); color: #4ade80; }
    .compact-project .cp-actions { flex-shrink: 0; display: flex; gap: 4px; }
    .compact-project .cp-actions button,
    .compact-project .cp-actions a {
      font-family: 'Courier New', monospace;
      font-size: 10px; letter-spacing: 0.5px;
      padding: 3px 10px; border-radius: 2px;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.04);
      color: rgba(255,255,255,0.4);
      cursor: pointer; transition: all 0.12s;
      text-decoration: none;
    }
    .compact-project .cp-actions button:hover,
    .compact-project .cp-actions a:hover { background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.7); }

    @media (max-width: 768px) {
      .compact-project { flex-wrap: wrap; gap: 4px; padding: 6px 10px 6px 14px; }
      .compact-project .cp-name { min-width: 0; width: auto; }
      .compact-project .cp-desc { width: 100%; order: 10; white-space: normal; }
    }

    .doc-viewer {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 4px;
      padding: 24px;
      max-width: 800px; margin: 0 auto;
    }
    .doc-viewer h2 { font-size: 16px; color: rgba(255,255,255,0.9); margin-bottom: 16px; }
    .doc-viewer pre { font-size: 11px; color: rgba(255,255,255,0.6); line-height: 1.6; white-space: pre-wrap; word-wrap: break-word; }
    .doc-list-btn {
      display: block; width: 100%; text-align: left;
      padding: 12px 16px; border-radius: 2px;
      border: 1px solid rgba(255,255,255,0.06);
      background: rgba(255,255,255,0.02);
      color: rgba(255,255,255,0.6);
      cursor: pointer; transition: all 0.15s;
    }
    .doc-list-btn:hover { background: rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.1); color: rgba(255,255,255,0.8); }
    .doc-list-btn .name { font-size: 12px; font-weight: 600; color: rgba(255,255,255,0.8); }
    .doc-list-btn .desc { font-size: 10px; color: rgba(255,255,255,0.4); margin-top: 2px; }

    .site-footer {
      position: relative; z-index: 20;
      text-align: center;
      padding: 16px 24px;
      font-size: 10px; color: rgba(255,255,255,0.2);
      letter-spacing: 1px;
    }
    .site-footer a { color: rgba(255,255,255,0.3); text-decoration: none; }
    .site-footer a:hover { color: rgba(255,255,255,0.6); }

    @media (max-width: 768px) {
      .container-card { width: 120px; min-height: 100px; padding: 6px; }
      .container-content .app-icon { font-size: 12px; }
      .container-content h2 { font-size: 9px; }
      .container-content .app-desc { font-size: 8px; }
      .container-actions a, .container-actions button {
        font-size: 9px; padding: 4px 6px; min-height: 40px;
      }
      .container-id { font-size: 8px; }
      .container-card .corner-tl,
      .container-card .corner-tr,
      .container-card .corner-bl,
      .container-card .corner-br { width: 4px; height: 4px; }
      .scene-controls { padding: 4px 8px; gap: 6px; }
      .scene-controls .disturb-btn { font-size: 8px; padding: 4px 8px; }
      .scene-controls .reroll-btn { font-size: 8px; padding: 4px 8px; }
      .running-ticker { font-size: 10px; padding: 4px 8px; }
      .top-bar { padding: 8px 8px 4px; gap: 8px; }
      .top-bar h1 { font-size: 16px; }
      .tab-bar { padding: 0 8px; gap: 12px; }
      .tab-btn { font-size: 9px; padding: 6px 2px 4px; }
      .scene-wrap { min-height: calc(100vh - 80px); }

    }
  </style>
</head>
<body>

<!-- ═══ TOP BAR ═══ -->
<div class="top-bar">
  <h1>🚢 shsw.dev</h1>
  <a href="https://calvinloveland.github.io/megarepo/" target="_blank" class="docs-link">📖 DOCS</a>
</div>

<!-- ═══ TABS ═══ -->
<div class="tab-bar" id="tabs">
  <button class="tab-btn active" data-tab="apps">Web Apps</button>
  <button class="tab-btn" data-tab="projects">All Projects</button>
  <button class="tab-btn" data-tab="docs">Docs</button>
</div>

<!-- ═══ TAB: WEB APPS (PHYSICS SCENE) ═══ -->
<div id="tab-apps" class="tab-content">
  <div class="scene-wrap" id="sceneWrap">
    <div class="scene-bg" id="sceneBg"></div>
    <canvas class="scene-canvas" id="physicsCanvas"></canvas>

    <!-- Scene controls -->
    <div class="scene-controls">
      <span class="scene-label">◈ SCENE</span>
      <span class="scene-name" id="sceneName">CARGO SHIP</span>
      <button class="disturb-btn" id="disturbBtn" onclick="disturbScene()" title="Temporarily scatter containers — they return in 5s">⚠ ROCK THE BOAT</button>
      <div id="gyroControl" style="display:none;align-items:center;gap:8px">
        <span class="gyro-indicator" id="gyroStatus">📱 WAITING</span>
        <div class="gyro-bar-bg"><div class="gyro-bar" id="gyroLevel"></div></div>
        <button class="reroll-btn" onclick="recalibrateGyro()" style="margin-left:0;font-size:9px">⟳ CAL</button>
      </div>
      <button class="reroll-btn" onclick="changeScene()">⟳ REROLL</button>
    </div>

    <div class="running-ticker">
      <strong id="runningCount">0</strong> / <span id="totalCount">0</span> containers
    </div>

    <!-- Physics-driven container cards -->
    <div id="physics-container"></div>

    <div class="site-footer">
      <a href="https://calvinloveland.github.io/megarepo/" target="_blank">📖 DOCS SITE</a>
      · shsw.dev ·
      <a href="#" onclick="event.preventDefault();refreshAll()">REFRESH</a>
    </div>
  </div>
</div>

<!-- ═══ TAB: ALL PROJECTS ═══ -->
<div id="tab-projects" class="tab-content hidden">
  <div class="content-slate">
    <div class="inner">
      <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:16px">
        <h2 style="font-size:14px;font-weight:600;color:rgba(255,255,255,0.6);letter-spacing:2px;text-transform:uppercase">ALL PROJECTS</h2>
        <input id="project-search" type="text" placeholder="🔍 Search by name or description..." style="font-family:'Courier New',monospace;font-size:12px;padding:8px 14px;border-radius:2px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.04);color:rgba(255,255,255,0.6);width:220px;outline:none" oninput="filterProjects()">
      </div>
      <div id="project-groups">
        <div style="text-align:center;padding:40px;color:rgba(255,255,255,0.3)">LOADING PROJECTS…</div>
      </div>

<!-- ═══ TAB: DOCS ═══ -->
<div id="tab-docs" class="tab-content hidden">
  <div class="content-slate">
    <div class="inner">
      <div style="margin-bottom:20px"><h2 style="font-size:14px;font-weight:600;color:rgba(255,255,255,0.6);letter-spacing:2px;text-transform:uppercase">PROJECT DOCS</h2></div>
      <div class="doc-viewer" id="doc-viewer">
        <div style="text-align:center;padding:40px;color:rgba(255,255,255,0.3)">Select a project to view its README.</div>
      </div>
    </div>
  </div>
</div>

<script>
// ══════════════════════════════════════════════════════
// CONTAINER DATA
// ══════════════════════════════════════════════════════
const APP_DATA = {{ apps|tojson|safe }};

const TYPE_COLORS = { flask:'blue', node:'orange', vite:'green', nextjs:'teal', static:'gray' };

function containerId(appId) {
  const owner = appId.slice(0,4).toUpperCase().padEnd(4,'U');
  let hash = 0x1234;
  for (let i = 0; i < appId.length; i++) hash = ((hash * 31) + appId.charCodeAt(i)) & 0xffff;
  return owner + ' ' + String(Math.abs(hash)).padStart(7,'0');
}

// ══════════════════════════════════════════════════════
// MATTER.JS PHYSICS ENGINE
// ══════════════════════════════════════════════════════
const { Engine, World, Bodies, Body, Constraint, Events, Composite, Vector, Runner } = Matter;

let engine, sceneName = 'ship', containerBodies = [], containerBodyOrigins = [], isDisturbed = false;
let physicsRunning = false, animFrame = null;
let settleTimer = null;

// ── Gyroscope state ──
let gyroActive = false, gyroAvailable = false;
let gyroBeta = 0, gyroGamma = 0;
let gyroCalBeta = 0, gyroCalGamma = 0, gyroCalibrated = false;

function initGyro() {
  // Check if device supports orientation
  if (typeof DeviceOrientationEvent === 'undefined') return;
  gyroAvailable = true;

  const handleOrientation = (e) => {
    if (e.beta === null || e.gamma === null) return;
    gyroBeta = e.beta;
    gyroGamma = e.gamma;
    if (!gyroCalibrated) {
      gyroCalBeta = e.beta;
      gyroCalGamma = e.gamma;
      gyroCalibrated = true;
      console.log('📱 Gyro calibrated:', gyroCalBeta, gyroCalGamma);
    }
  };

  // iOS 13+ requires permission request
  if (typeof DeviceOrientationEvent.requestPermission === 'function') {
    // Will be called on user gesture
    document.addEventListener('click', function requestPerm() {
      DeviceOrientationEvent.requestPermission().then(state => {
        if (state === 'granted') {
          window.addEventListener('deviceorientation', handleOrientation);
          gyroActive = true;
          document.getElementById('gyroStatus').textContent = '📱 ACTIVE';
          document.getElementById('gyroStatus').className = 'gyro-indicator gyro-on';
          // Hide disturb, show gyro
          document.getElementById('disturbBtn').style.display = 'none';
          document.getElementById('gyroControl').style.display = 'flex';
        }
      });
      document.removeEventListener('click', requestPerm);
    }, { once: true });
  } else {
    // Android / others — no permission needed
    window.addEventListener('deviceorientation', handleOrientation);
    gyroActive = true;
    document.getElementById('gyroStatus').textContent = '📱 ACTIVE';
    document.getElementById('gyroStatus').className = 'gyro-indicator gyro-on';
    document.getElementById('disturbBtn').style.display = 'none';
    document.getElementById('gyroControl').style.display = 'flex';
  }
}

function recalibrateGyro() {
  if (gyroBeta !== null && gyroGamma !== null) {
    gyroCalBeta = gyroBeta;
    gyroCalGamma = gyroGamma;
    gyroCalibrated = true;
    const toast = document.createElement('div');
    toast.style.cssText = 'position:fixed;top:60px;left:50%;transform:translateX(-50%);z-index:9999;padding:8px 16px;border-radius:4px;background:rgba(74,222,128,0.15);border:1px solid rgba(74,222,128,0.3);color:#4ade80;font-size:12px;font-family:monospace;pointer-events:none;transition:opacity 0.5s;';
    toast.textContent = '📱 Gyro recalibrated — hold phone still';
    document.body.appendChild(toast);
    setTimeout(() => { toast.style.opacity = '0'; }, 1200);
    setTimeout(() => toast.remove(), 1700);
  }
}

const CARD_W = 220, CARD_H = 130;
const CARD_W_MOBILE = 130, CARD_H_MOBILE = 100;

function getCardSize() {
  return window.innerWidth <= 640
    ? { w: CARD_W_MOBILE, h: CARD_H_MOBILE }
    : { w: CARD_W, h: CARD_H };
}

// ── Responsive column count based on viewport width ──
function calcCols(W, sz) {
  const maxCols = Math.floor((W - 40) / (sz.w + 10));
  return Math.max(1, Math.min(maxCols, 5));
}

// ── Create scene physics ──
function createScene(type) {
  if (engine) {
    World.clear(engine.world);
    Engine.clear(engine);
    if (animFrame) cancelAnimationFrame(animFrame);
    physicsRunning = false;
  }
  engine = Engine.create({
    gravity: { x: 0, y: 1.5 }
  });
  containerBodies = [];
  isDisturbed = false;
  sceneName = type;

  const wrap = document.getElementById('sceneWrap');
  const bg = document.getElementById('sceneBg');

  // Set scene class
  wrap.className = 'scene-wrap';
  ['scene-ship','scene-train','scene-crane','scene-depot'].forEach(c => wrap.classList.remove(c));
  wrap.classList.add('scene-' + type);

  // Scene-specific background
  bg.innerHTML = '';
  if (type === 'train') {
    const t = document.createElement('div'); t.className = 'train-tracks';
    bg.appendChild(t);
  }
  if (type === 'crane') {
    const c = document.createElement('div'); c.className = 'crane-structure';
    bg.appendChild(c);
  }

  // Build physics world for this scene
  // Use window.innerHeight as primary to ensure correct mobile sizing
  const rect = wrap.getBoundingClientRect();
  const W = rect.width || window.innerWidth;
  const H = Math.max(rect.height, window.innerHeight - 100, 600);
  const sz = getCardSize();
  const gap = 10;

  // Ground
  let groundY;
  if (type === 'ship') {
    groundY = H * 0.7;
    // Ship deck — flat for stable clicking
    const deck = Bodies.rectangle(W/2, groundY - 20, W * 0.9, 20, {
      isStatic: true, label: 'deck', angle: 0,
      friction: 0.95
    });
    // Ship hull walls
    const leftWall = Bodies.rectangle(10, groundY - 100, 20, 200, { isStatic: true });
    const rightWall = Bodies.rectangle(W-10, groundY - 100, 20, 200, { isStatic: true });
    Composite.add(engine.world, [deck, leftWall, rightWall]);

    // Arrange containers on deck — responsive columns
    const cols = calcCols(W, sz);
    let idx = 0;
    const totalX = cols * sz.w + (cols - 1) * gap;
    const startX = (W - totalX) / 2 + sz.w/2;
    APP_DATA.forEach(app => {
      if (app.id === 'launcher') return;
      const col = idx % cols;
      const row = Math.floor(idx / cols);
      const x = startX + col * (sz.w + gap);
      const y = groundY - 30 - row * (sz.h + gap) - sz.h/2;
      const body = Bodies.rectangle(x, y, sz.w - 4, sz.h - 4, {
        friction: 0.95, restitution: 0.01, density: 0.004,
        label: app.id, chamfer: { radius: 2 }
      });
      containerBodies.push(body);
      idx++;
    });
  } else if (type === 'train') {
    groundY = H * 0.82;
    const ground = Bodies.rectangle(W/2, groundY + 20, W * 2, 80, { isStatic: true, friction: 0.95 });
    Composite.add(engine.world, ground);

    // Train flatbeds — responsive car count
    const nCars = calcCols(W, sz);
    const trainStartX = Math.max(20, (W - nCars * (sz.w + 20)) / 2);
    for (let i = 0; i < nCars; i++) {
      const cx = trainStartX + i * (sz.w + 20) + sz.w/2;
      const car = Bodies.rectangle(cx, groundY - 5, sz.w + 10, 12, {
        isStatic: true, friction: 0.95, label: 'car_' + i
      });
      Composite.add(engine.world, car);
    }

    // Containers on flatbeds
    APP_DATA.forEach((app, idx) => {
      if (app.id === 'launcher') return;
      const carIdx = idx % nCars;
      const stackRow = Math.floor(idx / nCars);
      const cx = trainStartX + carIdx * (sz.w + 20) + sz.w/2;
      const y = groundY - 18 - stackRow * (sz.h + 5) - sz.h/2;
      const body = Bodies.rectangle(cx, y, sz.w - 4, sz.h - 4, {
        friction: 0.95, restitution: 0.01, density: 0.004,
        label: app.id, chamfer: { radius: 2 }
      });
      containerBodies.push(body);
    });
  } else if (type === 'crane') {
    groundY = H * 0.75;
    const ground = Bodies.rectangle(W/2, groundY + 40, W * 2, 80, { isStatic: true, friction: 0.95 });
    // Left and right walls for stacking area
    const leftWall = Bodies.rectangle(30, groundY - 50, 20, 200, { isStatic: true, friction: 0.95 });
    const rightWall = Bodies.rectangle(W-30, groundY - 50, 20, 200, { isStatic: true, friction: 0.95 });
    Composite.add(engine.world, [ground, leftWall, rightWall]);

    // Most containers on ground, some suspended from crane
    APP_DATA.forEach((app, idx) => {
      if (app.id === 'launcher') return;
      if (idx < Math.ceil(APP_DATA.filter(a => a.id !== 'launcher').length * 0.7)) {
        // On ground — responsive cols
        const craneCols = calcCols(W, sz);
        const craneTotalX = craneCols * sz.w + (craneCols - 1) * 8;
        const craneStartX = Math.max(40, (W - craneTotalX) / 2) + sz.w/2;
        const col = idx % craneCols;
        const row = Math.floor(idx / craneCols);
        const x = craneStartX + col * (sz.w + 8);
        const y = groundY - 10 - row * (sz.h + 5) - sz.h/2;
        const body = Bodies.rectangle(x, y, sz.w - 4, sz.h - 4, {
          friction: 0.95, restitution: 0.01, density: 0.004,
          label: app.id, chamfer: { radius: 2 }
        });
        containerBodies.push(body);
      } else {
        // Suspended — hanging from crane at top
        const x = W/2 + (idx % 2 === 0 ? -80 : 80);
        const body = Bodies.rectangle(x, H * 0.3, sz.w - 4, sz.h - 4, {
          friction: 0.95, restitution: 0.05, density: 0.002,
          label: app.id, chamfer: { radius: 2 }
        });
        // Crane cable constraint
        const anchor = { x: W/2, y: 20 };
        const cable = Constraint.create({
          pointA: anchor,
          bodyB: body,
          pointB: { x: 0, y: -sz.h/2 },
          stiffness: 0.02,
          damping: 0.05,
          length: 40
        });
        Composite.add(engine.world, [body, cable]);
        containerBodies.push(body);
      }
    });
  } else { // depot
    groundY = H * 0.78;
    const ground = Bodies.rectangle(W/2, groundY + 40, W * 2, 80, { isStatic: true, friction: 0.95 });
    // Back wall
    const backWall = Bodies.rectangle(W/2, groundY - 150, W, 20, { isStatic: true, friction: 0.95 });
    const leftWall = Bodies.rectangle(20, groundY - 80, 20, 200, { isStatic: true, friction: 0.95 });
    const rightWall = Bodies.rectangle(W-20, groundY - 80, 20, 200, { isStatic: true, friction: 0.95 });
    Composite.add(engine.world, [ground, backWall, leftWall, rightWall]);

    // Containers stacked tightly — responsive cols
    const depotCols = calcCols(W, sz);
    const depotTotalX = depotCols * sz.w + (depotCols - 1) * 8;
    const depotStartX = Math.max(30, (W - depotTotalX) / 2) + sz.w/2;
    APP_DATA.forEach((app, idx) => {
      if (app.id === 'launcher') return;
      const col = idx % depotCols;
      const row = Math.floor(idx / depotCols);
      const x = depotStartX + col * (sz.w + 8);
      const y = groundY - 10 - row * (sz.h + 4) - sz.h/2;
      const body = Bodies.rectangle(x, y, sz.w - 4, sz.h - 4, {
        friction: 0.95, restitution: 0.01, density: 0.004,
        label: app.id, chamfer: { radius: 2 }
      });
      containerBodies.push(body);
    });
  }

  // Store original positions for reset
  containerBodyOrigins = containerBodies.map(b => ({ x: b.position.x, y: b.position.y, angle: b.angle }));

  // Add a wide catcher floor below the visible area so bodies don't fall forever
  const catcherFloor = Bodies.rectangle(W/2, H + 150, W * 3, 300, {
    isStatic: true, friction: 0.95, label: 'catcher'
  });
  Composite.add(engine.world, catcherFloor);

  // Add all container bodies to world
  containerBodies.forEach(b => Composite.add(engine.world, b));

  // Create DOM elements for containers
  createContainerDOM();

  // Hide catcher visually
  document.getElementById('physics-container').dataset.caught = '0';

  // Update scene label
  const sceneNames = { ship:'CARGO SHIP', train:'RAIL YARD', crane:'PORT CRANE', depot:'CONTAINER DEPOT' };
  const sceneIcons = { ship:'🚢', train:'🚂', crane:'🏗️', depot:'📦' };
  document.getElementById('sceneName').textContent = sceneIcons[type] + ' ' + sceneNames[type];

  // Disturb button text
  const disturbTexts = { ship:'ROCK THE BOAT!', train:'DERAIL!', crane:'SWING LOAD!', depot:'TOPPLE!' };
  document.getElementById('disturbBtn').textContent = '⚠ ' + disturbTexts[type];

  // Show/hide gyro vs disturb based on availability
  if (gyroAvailable) {
    document.getElementById('gyroControl').style.display = 'none';
    document.getElementById('disturbBtn').style.display = '';
  }

  // Start physics
  startPhysics();

  // Auto-settle after physics simulation so containers are perfectly still for clicking
  if (window._settleTimer) clearTimeout(window._settleTimer);
  window._settleTimer = setTimeout(settleBodies, 3000);

  // Set initial positions of DOM elements
  syncPhysicsToDOM();
}

// ── Create container DOM elements ──
function createContainerDOM() {
  const container = document.getElementById('physics-container');
  container.innerHTML = '';
  let running = 0;

  APP_DATA.forEach(app => {
    if (app.id === 'launcher') return;
    if (app.running) running++;

    const color = TYPE_COLORS[app.type] || 'gray';
    const actions = app.running
      ? `<a href="${app.url}" target="_blank" class="btn-open">OPEN →</a>`
      : `<button class="btn-start" onclick="startApp('${app.id}')">▶ START</button>`;

    const div = document.createElement('div');
    div.className = `container-card container-color-${color}`;
    div.dataset.appId = app.id;
    div.dataset.running = app.running ? 'true' : 'false';
    div.innerHTML = `
      <div class="corner-tl"></div><div class="corner-tr"></div>
      <div class="corner-bl"></div><div class="corner-br"></div>
      <div class="status-dot-card ${app.running ? 'running' : 'stopped'}"></div>
      <div class="container-id">${containerId(app.id)}</div>
      <div class="container-content">
        <div class="app-icon">${app.icon || '📦'}</div>
        <h2>${app.name}</h2>
        <div class="app-desc">${(app.description || '').substring(0, 50)}</div>
        <div class="container-actions">${actions}</div>
      </div>
    `;
    container.appendChild(div);
  });

  document.getElementById('runningCount').textContent = running;
  document.getElementById('totalCount').textContent = APP_DATA.filter(a => a.id !== 'launcher').length;
}

// ── Sync Matter.js bodies to DOM positions ──
function syncPhysicsToDOM() {
  const cards = document.querySelectorAll('.container-card');
  const bodyMap = {};
  containerBodies.forEach(b => { bodyMap[b.label] = b; });

  cards.forEach(el => {
    const id = el.dataset.appId;
    const body = bodyMap[id];
    if (!body) return;

    const x = body.position.x;
    const y = body.position.y;
    const angle = body.angle;
    const sz = getCardSize();

    el.style.left = (x - sz.w/2) + 'px';
    el.style.top = (y - sz.h/2) + 'px';
    el.style.transform = `rotate(${angle}rad)`;
    el.style.opacity = '1';
  });
}

// ── Physics loop ──
function startPhysics() {
  if (physicsRunning) return;
  physicsRunning = true;

  function loop() {
    if (!physicsRunning) return;
    Engine.update(engine, 1000/60);
    syncPhysicsToDOM();
    animFrame = requestAnimationFrame(loop);
  }
  loop();

  // Catcher floor catches bodies that fall off the main area
  Events.on(engine, 'afterUpdate', () => {
    const wrap = document.getElementById('sceneWrap');
    const rect = wrap.getBoundingClientRect();
    const W = Math.max(rect.width, window.innerWidth, 360);

    // Apply gyroscope forces if active
    if (gyroActive && gyroCalibrated) {
      const dBeta = Math.max(-1, Math.min(1, (gyroBeta - gyroCalBeta) / 45));
      const dGamma = Math.max(-1, Math.min(1, (gyroGamma - gyroCalGamma) / 45));
      const forceX = dGamma * 0.004;
      const forceY = dBeta * 0.004;
      const gyroForceMag = Math.sqrt(forceX*forceX + forceY*forceY);

      containerBodies.forEach(body => {
        if (!body.isStatic) {
          Body.applyForce(body, body.position, { x: forceX, y: forceY });
        }
      });

      // Update gyro indicator level
      const el = document.getElementById('gyroLevel');
      if (el) {
        const pct = Math.min(100, gyroForceMag * 5000);
        el.style.width = pct + '%';
        el.style.background = pct > 50 ? 'rgba(255,100,50,0.6)' : 'rgba(74,222,128,0.6)';
      }
    }

    // Clamp horizontal movement — vertical is handled by catcher floor
    containerBodies.forEach(body => {
      if (body.position.x < -300) {
        Body.setPosition(body, { x: W + 50, y: body.position.y });
        Body.setVelocity(body, { x: 0, y: body.velocity.y });
      }
      if (body.position.x > W + 300) {
        Body.setPosition(body, { x: -50, y: body.position.y });
        Body.setVelocity(body, { x: 0, y: body.velocity.y });
      }
    });
  });
}

function stopPhysics() {
  physicsRunning = false;
  if (animFrame) cancelAnimationFrame(animFrame);
  if (settleTimer) clearTimeout(settleTimer);
}

// ── Settle bodies: make all container bodies static so UI is perfectly clickable ──
function settleBodies() {
  if (!containerBodies.length) return;
  containerBodies.forEach(body => { Body.setStatic(body, true); });
  isDisturbed = false;
  const btn = document.getElementById('disturbBtn');
  if (btn) btn.disabled = false;
}

// ── Disturb ──
function disturbScene() {
  if (isDisturbed || !engine) return;
  isDisturbed = true;

  // Make all bodies dynamic again before applying forces
  containerBodies.forEach(body => { Body.setStatic(body, false); });

  const btn = document.getElementById('disturbBtn');
  btn.disabled = true;

  // Apply forces based on scene type
  containerBodies.forEach((body, i) => {
    if (sceneName === 'ship') {
      // Random sideways forces — rocking
      Body.applyForce(body, body.position, {
        x: (Math.random() - 0.5) * 0.05,
        y: -0.02 - Math.random() * 0.03
      });
      Body.setAngularVelocity(body, (Math.random() - 0.5) * 0.3);
    } else if (sceneName === 'train') {
      // Strong horizontal force — derailment!
      Body.applyForce(body, body.position, {
        x: 0.06 + Math.random() * 0.04,
        y: -0.02 - Math.random() * 0.05
      });
      Body.setAngularVelocity(body, (Math.random() - 0.5) * 0.5);
    } else if (sceneName === 'crane') {
      // Wild swinging
      Body.applyForce(body, body.position, {
        x: (Math.random() - 0.5) * 0.08,
        y: -0.05 - Math.random() * 0.05
      });
    } else if (sceneName === 'depot') {
      // Chain reaction — push bottom containers
      const heightFactor = 1 - (i / containerBodies.length);
      Body.applyForce(body, body.position, {
        x: (Math.random() - 0.5) * 0.06 * heightFactor,
        y: -0.01
      });
    }
  });

  // Toast
  const msgs = {
    ship: '🌊 Ship rocking! Containers sliding!',
    train: '💥 Derailed! Containers flying everywhere!',
    crane: '🏗️ Load swinging wildly!',
    depot: '📦 Domino effect! Containers toppling!'
  };
  const toast = document.createElement('div');
  toast.style.cssText = `
    position:fixed;top:20px;left:50%;transform:translateX(-50%);
    z-index:9999;padding:10px 24px;border-radius:4px;
    background:rgba(255,100,50,0.15);border:1px solid rgba(255,100,50,0.3);
    color:rgba(255,150,100,0.9);font-size:13px;font-weight:600;
    letter-spacing:1px;font-family:'Courier New',monospace;
    pointer-events:none;transition:opacity 0.5s;
  `;
  toast.textContent = msgs[sceneName] || '💥 Physics!';
  document.body.appendChild(toast);
  setTimeout(() => { toast.style.opacity = '0'; }, 1500);
  setTimeout(() => toast.remove(), 2000);

  // Let physics settle, then smoothly reset bodies back to origins
  settleTimer = setTimeout(() => {
    smoothReset();
  }, 5000);
}

// ── Smoothly animate bodies back to starting positions ──
function smoothReset() {
  isDisturbed = false;
  const btn = document.getElementById('disturbBtn');
  btn.disabled = false;

  // Make all container bodies static during animation to fight physics
  containerBodies.forEach(body => { Body.setStatic(body, true); });

  // Animate each body back to its origin over ~1s
  const duration = 1000;
  const startPositions = containerBodies.map(b => ({ x: b.position.x, y: b.position.y, angle: b.angle }));
  const startTime = performance.now();

  function animateReset(now) {
    const elapsed = now - startTime;
    const t = Math.min(elapsed / duration, 1);
    // Ease-out cubic
    const ease = 1 - Math.pow(1 - t, 3);

    containerBodies.forEach((body, i) => {
      if (containerBodyOrigins[i]) {
        const start = startPositions[i];
        const end = containerBodyOrigins[i];
        Body.setPosition(body, {
          x: start.x + (end.x - start.x) * ease,
          y: start.y + (end.y - start.y) * ease
        });
        Body.setAngle(body, start.angle + (end.angle - start.angle) * ease);
      }
    });

    syncPhysicsToDOM();

    if (t < 1) {
      requestAnimationFrame(animateReset);
    } else {
      // Final snap to exact origins
      containerBodies.forEach((body, i) => {
        if (containerBodyOrigins[i]) {
          const o = containerBodyOrigins[i];
          Body.setPosition(body, { x: o.x, y: o.y });
          Body.setAngle(body, o.angle);
        }
      });
      syncPhysicsToDOM();

      // Keep bodies static so containers stay perfectly clickable until next disturb
    }
  }
  requestAnimationFrame(animateReset);
}

// ── Change scene ──
const SCENES = ['ship', 'train', 'crane', 'depot'];
function changeScene() {
  const current = SCENES.indexOf(sceneName);
  const next = SCENES[(current + 1) % SCENES.length];
  createScene(next);
}

// ══════════════════════════════════════════════════════
// TAB SWITCHING
// ══════════════════════════════════════════════════════
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.tab-content').forEach(t => t.classList.add('hidden'));
    const tab = document.getElementById('tab-' + btn.dataset.tab);
    tab.classList.remove('hidden');

    if (btn.dataset.tab === 'projects') loadProjects();
    if (btn.dataset.tab === 'docs') loadDocList();
    // Rebuild physics when switching back to apps tab
    if (btn.dataset.tab === 'apps') {
      createScene(sceneName || 'ship');
    }
  });
});

// ══════════════════════════════════════════════════════
// WEB APPS (Start/Stop cards)
// ══════════════════════════════════════════════════════
function updateCard(appId, state, url) {
  const card = document.querySelector(`[data-app-id="${appId}"]`);
  if (!card) return;
  const dot = card.querySelector('.status-dot-card');
  const actions = card.querySelector('.container-actions');

  dot.className = 'status-dot-card ' + state;
  card.dataset.running = state === 'running' ? 'true' : 'false';

  if (state === 'running') {
    actions.innerHTML = `<a href="${url}" target="_blank" class="btn-open">OPEN →</a>`;
  } else if (state === 'loading') {
    actions.innerHTML = `<button class="btn-start loading">⟳ STARTING</button>`;
  } else {
    actions.innerHTML = `<button class="btn-start" onclick="startApp('${appId}')">▶ START</button>`;
  }
  updateRunningCount();
}

function updateRunningCount() {
  const n = document.querySelectorAll('[data-running="true"]').length;
  document.getElementById('runningCount').textContent = n;
}

async function startApp(appId) {
  updateCard(appId, 'loading', null);
  try {
    const res = await fetch(`/api/start/${appId}`, {method:'POST'});
    const data = await res.json();
    if (data.ok && data.url) updateCard(appId, 'running', data.url);
    else { updateCard(appId, 'stopped'); if (data.error) alert('FAILED: ' + data.error); }
  } catch(e) { updateCard(appId, 'stopped'); alert('NETWORK ERROR'); }
}

async function refreshAll() {
  try {
    const res = await fetch('/api/apps');
    const apps = await res.json();
    apps.forEach(a => {
      if (a.id !== 'launcher') updateCard(a.id, a.running ? 'running' : 'stopped', a.url);
    });
  } catch(e) {}
}
setInterval(refreshAll, 10000);
updateRunningCount();

// ══════════════════════════════════════════════════════
// PROJECTS TAB
// ══════════════════════════════════════════════════════
let projectsCache = null;
const TYPE_LABELS = { game:'🎮 Games', webapp:'🌐 Web Apps', devtool:'🔧 Dev Tools', bot:'🤖 Bots', config:'❄️ Config', project:'📦 Other' };
const TYPE_ORDER = ['game', 'webapp', 'devtool', 'bot', 'config', 'project'];

async function loadProjects() {
  const container = document.getElementById('project-groups');
  if (projectsCache) { renderProjects(projectsCache); return; }
  try {
    const res = await fetch('/api/projects');
    projectsCache = await res.json();
    renderProjects(projectsCache);
  } catch(e) { container.innerHTML = '<div style="text-align:center;padding:40px;color:#ef4444">FAILED TO LOAD</div>'; }
}

function filterProjects() {
  if (!projectsCache) return;
  renderProjects(projectsCache);
}

function toggleGroup(btn) {
  btn.classList.toggle('collapsed');
  const body = btn.nextElementSibling;
  if (body) body.classList.toggle('hidden');
}

function groupMatch(p, query) {
  if (!query) return true;
  const q = query.toLowerCase();
  return p.name.toLowerCase().includes(q) ||
    (p.description || '').toLowerCase().includes(q) ||
    (p.type || '').toLowerCase().includes(q);
}

function renderProjects(projects) {
  const container = document.getElementById('project-groups');
  if (!projects || !projects.length) {
    container.innerHTML = '<div style="text-align:center;padding:40px;color:rgba(255,255,255,0.3)">NO PROJECTS</div>';
    return;
  }

  const query = (document.getElementById('project-search')?.value || '').trim();

  // Group by type, filtered
  const groups = {};
  projects.forEach(p => {
    if (!groupMatch(p, query)) return;
    const t = p.type || 'project';
    if (!groups[t]) groups[t] = [];
    groups[t].push(p);
  });

  // Sort projects alphabetically within each group
  Object.values(groups).forEach(arr => arr.sort((a, b) => a.name.localeCompare(b.name)));

  // Check if search returned no results
  const totalFiltered = Object.values(groups).reduce((s, a) => s + a.length, 0);
  if (totalFiltered === 0) {
    container.innerHTML = '<div style="text-align:center;padding:40px;color:rgba(255,255,255,0.3)">No projects match "' + escapeHtml(query) + '"</div>';
    return;
  }

  let html = '';
  TYPE_ORDER.forEach(t => {
    if (!groups[t] || !groups[t].length) return;
    const label = TYPE_LABELS[t] || '📦 Other';
    const expand = query ? '' : ' collapsed';
    html += `
    <div class="project-group">
      <button class="group-header${expand}" onclick="toggleGroup(this)">
        <span>${label}</span>
        <span class="group-count">${groups[t].length}</span>
        <span class="group-arrow">▼</span>
      </button>
      <div class="group-body${query ? '' : ' hidden'}">
        ${groups[t].map(p => {
          const tags = [];
          if (p.has_tests) tags.push('<span class="cp-tag tests">✓TESTS</span>');
          return `<div class="compact-project">
            <span class="cp-icon">${p.icon || '📦'}</span>
            <span class="cp-name">${escapeHtml(p.name)}</span>
            <span class="cp-desc">${escapeHtml((p.description || '').substring(0, 80))}</span>
            ${tags.join('')}
            <span class="cp-actions">
              <button onclick="showReadme('${p.id}')" title="Read README">📖</button>
              ${p.url ? `<a href="${p.url}" target="_blank" title="Open">OPEN</a>` : ''}
              ${p.local_url ? `<a href="${p.local_url}" target="_blank" title="Local" style="opacity:0.5">🔗</a>` : ''}
            </span>
          </div>`;
        }).join('')}
      </div>
    </div>`;
  });
  container.innerHTML = html;
}



// ══════════════════════════════════════════════════════
// DOCS / README VIEWER
// ══════════════════════════════════════════════════════
async function showReadme(projectId) {
  const viewer = document.getElementById('doc-viewer');
  viewer.innerHTML = '<div style="text-align:center;padding:40px;color:rgba(255,255,255,0.3)">LOADING README…</div>';
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelector('[data-tab="docs"]').classList.add('active');
  document.querySelectorAll('.tab-content').forEach(t => t.classList.add('hidden'));
  document.getElementById('tab-docs').classList.remove('hidden');
  if (!projectsCache) { try { const r = await fetch('/api/projects'); projectsCache = await r.json(); } catch(e) { return; } }
  try {
    const res = await fetch(`/api/projects/${projectId}/readme`);
    const data = await res.json();
    if (data.ok) viewer.innerHTML = `<h2>${data.name}</h2><pre>${escapeHtml(data.content)}</pre>`;
    else viewer.innerHTML = `<div style="text-align:center;padding:40px;color:#eab308">${data.error || 'NOT FOUND.'}</div>`;
  } catch(e) { viewer.innerHTML = '<div style="text-align:center;padding:40px;color:#ef4444">FAILED.</div>'; }
}
async function loadDocList() {
  const viewer = document.getElementById('doc-viewer');
  if (!projectsCache) { try { const r = await fetch('/api/projects'); projectsCache = await r.json(); } catch(e) { return; } }
  const withReadme = projectsCache.filter(p => p.has_readme);
  if (!withReadme.length) { viewer.innerHTML = '<div style="text-align:center;padding:40px;color:rgba(255,255,255,0.3)">NO READMES.</div>'; return; }
  viewer.innerHTML = `<h2>📖 PROJECT READMES</h2>
    <div style="display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))">
      ${withReadme.map(p => `<button class="doc-list-btn" onclick="showReadme('${p.id}')"><div class="name">${p.icon || '📄'} ${p.name}</div><div class="desc">${p.description || ''}</div></button>`).join('')}
    </div>`;
}
function escapeHtml(text) { const d = document.createElement('div'); d.textContent = text; return d.innerHTML; }

// ══════════════════════════════════════════════════════
// KEYBOARD SHORTCUTS
// ══════════════════════════════════════════════════════
document.addEventListener('keydown', (e) => {
  // Only if not typing in an input
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  const appsActive = !document.getElementById('tab-apps').classList.contains('hidden');

  // Space → disturb (on apps tab)
  if (e.code === 'Space' && appsActive) {
    e.preventDefault();
    const btn = document.getElementById('disturbBtn');
    if (btn && !btn.disabled) disturbScene();
    return;
  }

  // R → reroll scene (on apps tab)
  if ((e.key === 'r' || e.key === 'R') && appsActive) {
    changeScene();
    return;
  }

  // Left/Right → cycle scene (on apps tab)
  if ((e.key === 'ArrowRight' || e.key === 'ArrowLeft') && appsActive) {
    changeScene();
    return;
  }

  // 1, 2, 3 → switch tabs
  if (e.key === '1') { document.querySelector('[data-tab="apps"]')?.click(); return; }
  if (e.key === '2') { document.querySelector('[data-tab="projects"]')?.click(); return; }
  if (e.key === '3') { document.querySelector('[data-tab="docs"]')?.click(); return; }
});

// ══════════════════════════════════════════════════════
// INIT
// ══════════════════════════════════════════════════════
window.addEventListener('load', () => {
  setTimeout(() => createScene('ship'), 100);
  initGyro();
});
window.addEventListener('resize', () => {
  // Throttled: recreate scene on significant resize
  if (window._resizeTimer) clearTimeout(window._resizeTimer);
  window._resizeTimer = setTimeout(() => {
    if (!document.getElementById('tab-apps').classList.contains('hidden')) {
      createScene(sceneName || 'ship');
    }
  }, 500);
});
</script>
