[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "image-vae-demo"
version = "0.1.0"
description = "Web demo for the image VAE extreme compressor"
requires-python = ">=3.10"
dependencies = [
    "flask>=3",
    "torch>=2.0",
    "torchvision>=0.15",
    "Pillow",
]

[tool.setuptools.packages.find]
where = ["src"]
