apiVersion: v1
kind: Namespace
metadata:
  name: sub-day-generator
---
apiVersion: v1
kind: Secret
metadata:
  name: sub-day-generator-env
  namespace: sub-day-generator
type: Opaque
stringData:
  FLASK_DEBUG: "false"
  HOST: "0.0.0.0"
  PORT: "5000"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sub-day-generator
  namespace: sub-day-generator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sub-day-generator
  template:
    metadata:
      labels:
        app: sub-day-generator
    spec:
      containers:
        - name: sub-day-generator
          image: python:3.12-slim
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - |
              APP_DIR=/tmp/megarepo-main/active/web-apps/sub-day-generator

              fetch_remote_sha() {
                python - <<'PY'
              import json
              from urllib.request import Request, urlopen

              req = Request(
                  "https://api.github.com/repos/calvinloveland/megarepo/commits/main",
                  headers={
                      "Accept": "application/vnd.github+json",
                      "User-Agent": "sub-day-generator-git-sync",
                  },
              )
              with urlopen(req, timeout=10) as response:
                  payload = json.load(response)
              print(payload.get("sha", ""))
              PY
              }

              install_app() {
                rm -rf /tmp/megarepo-main /tmp/megarepo-main.tar.gz
                python -c 'from urllib.request import urlretrieve; urlretrieve("https://github.com/calvinloveland/megarepo/archive/refs/heads/main.tar.gz", "/tmp/megarepo-main.tar.gz")'
                tar -xzf /tmp/megarepo-main.tar.gz -C /tmp
                cd "$APP_DIR"
                pip install --no-cache-dir "Flask>=2.3" "gunicorn>=21.2,<22"
                pip install --no-cache-dir --no-deps -e .
              }

              CURRENT_SHA="$(fetch_remote_sha || true)"
              install_app
              printf '%s\n' "${CURRENT_SHA:-}" > /tmp/sub-day-generator-source-sha

              cd "$APP_DIR"
              gunicorn -w 2 -b 0.0.0.0:5000 "sub_day_generator.app:create_app()" &
              APP_PID=$!

              (
                while true; do
                  sleep "${GIT_SYNC_INTERVAL_SECONDS:-900}"
                  NEW_SHA="$(fetch_remote_sha || true)"
                  [ -z "$NEW_SHA" ] && continue
                  OLD_SHA="$(cat /tmp/sub-day-generator-source-sha 2>/dev/null || true)"
                  [ "$NEW_SHA" = "$OLD_SHA" ] && continue
                  echo "New main commit detected ($OLD_SHA -> $NEW_SHA); restarting pod to refresh code."
                  kill "$APP_PID" >/dev/null 2>&1 || true
                  break
                done
              ) &

              wait "$APP_PID"
          env:
            - name: FLASK_DEBUG
              valueFrom:
                secretKeyRef:
                  name: sub-day-generator-env
                  key: FLASK_DEBUG
            - name: HOST
              valueFrom:
                secretKeyRef:
                  name: sub-day-generator-env
                  key: HOST
            - name: PORT
              valueFrom:
                secretKeyRef:
                  name: sub-day-generator-env
                  key: PORT
            - name: GIT_SYNC_INTERVAL_SECONDS
              value: "900"
          ports:
            - name: http
              containerPort: 5000
        - name: cloudflared
          image: cloudflare/cloudflared:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: sub-day-generator-cloudflared-token
                  key: token
          args:
            - tunnel
            - --no-autoupdate
            - run
            - --token
            - $(TUNNEL_TOKEN)
---
apiVersion: v1
kind: Service
metadata:
  name: sub-day-generator
  namespace: sub-day-generator
spec:
  selector:
    app: sub-day-generator
  ports:
    - name: http
      port: 5000
      targetPort: http
