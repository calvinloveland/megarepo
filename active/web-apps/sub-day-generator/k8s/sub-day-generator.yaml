apiVersion: v1
kind: Namespace
metadata:
  name: sub-day-generator
---
apiVersion: v1
kind: Secret
metadata:
  name: sub-day-generator-env
  namespace: sub-day-generator
type: Opaque
stringData:
  FLASK_DEBUG: "false"
  HOST: "0.0.0.0"
  PORT: "5000"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sub-day-generator
  namespace: sub-day-generator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sub-day-generator
  template:
    metadata:
      labels:
        app: sub-day-generator
    spec:
      securityContext:
        fsGroup: 1001
      containers:
        - name: sub-day-generator
          image: 127.0.0.1:5000/sub-day-generator:latest
          imagePullPolicy: Always
          env:
            - name: FLASK_DEBUG
              valueFrom:
                secretKeyRef:
                  name: sub-day-generator-env
                  key: FLASK_DEBUG
            - name: HOST
              valueFrom:
                secretKeyRef:
                  name: sub-day-generator-env
                  key: HOST
            - name: PORT
              valueFrom:
                secretKeyRef:
                  name: sub-day-generator-env
                  key: PORT
          ports:
            - name: http
              containerPort: 5000
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 1001
        - name: cloudflared
          image: cloudflare/cloudflared:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: sub-day-generator-cloudflared-token
                  key: token
          args:
            - tunnel
            - --no-autoupdate
            - --url
            - http://localhost:5000
            - run
            - --token
            - $(TUNNEL_TOKEN)
---
apiVersion: v1
kind: Service
metadata:
  name: sub-day-generator
  namespace: sub-day-generator
spec:
  selector:
    app: sub-day-generator
  ports:
    - name: http
      port: 5000
      targetPort: http
