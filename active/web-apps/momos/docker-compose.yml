services:
  cozi:
    build: .
    ports:
      - "5002:5000"
    environment:
      FLASK_DEBUG: "false"
      HOST: "0.0.0.0"
      PORT: "5000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/')"]
      interval: 30s
      timeout: 5s
      retries: 3
