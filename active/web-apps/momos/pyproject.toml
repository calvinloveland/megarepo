[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "momos"
version = "0.1.0"
description = "Prototype family command center for household logistics"
requires-python = ">=3.8"
dependencies = [
    "Flask>=2.3",
    "pytest>=7.4",
]

[project.scripts]
momos = "momos.app:main"

[tool.setuptools.packages.find]
where = ["src"]
