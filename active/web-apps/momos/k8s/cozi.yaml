apiVersion: v1
kind: Namespace
metadata:
  name: cozi
---
apiVersion: v1
kind: Secret
metadata:
  name: cozi-env
  namespace: cozi
type: Opaque
stringData:
  FLASK_DEBUG: "false"
  HOST: "0.0.0.0"
  PORT: "5000"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cozi
  namespace: cozi
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cozi
  template:
    metadata:
      labels:
        app: cozi
    spec:
      securityContext:
        fsGroup: 1001
      containers:
        - name: cozi
          image: 127.0.0.1:5000/cozi:latest
          imagePullPolicy: Always
          env:
            - name: FLASK_DEBUG
              valueFrom:
                secretKeyRef:
                  name: cozi-env
                  key: FLASK_DEBUG
            - name: HOST
              valueFrom:
                secretKeyRef:
                  name: cozi-env
                  key: HOST
            - name: PORT
              valueFrom:
                secretKeyRef:
                  name: cozi-env
                  key: PORT
          ports:
            - name: http
              containerPort: 5000
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 1001
        - name: cloudflared
          image: cloudflare/cloudflared:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cozi-cloudflared-token
                  key: token
          args:
            - tunnel
            - --no-autoupdate
            - --url
            - http://localhost:5000
            - run
            - --token
            - $(TUNNEL_TOKEN)
---
apiVersion: v1
kind: Service
metadata:
  name: cozi
  namespace: cozi
spec:
  selector:
    app: cozi
  ports:
    - name: http
      port: 5000
      targetPort: http
