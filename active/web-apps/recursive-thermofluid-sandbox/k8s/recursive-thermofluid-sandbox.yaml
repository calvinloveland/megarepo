apiVersion: v1
kind: Namespace
metadata:
  name: thermofluid
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: recursive-thermofluid-sandbox
  namespace: thermofluid
  labels:
    app.kubernetes.io/name: recursive-thermofluid-sandbox
    app.kubernetes.io/part-of: shsw-dev
    app.kubernetes.io/component: web-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: recursive-thermofluid-sandbox
  template:
    metadata:
      labels:
        app: recursive-thermofluid-sandbox
        app.kubernetes.io/name: recursive-thermofluid-sandbox
        app.kubernetes.io/part-of: shsw-dev
    spec:
      containers:
        - name: app
          image: 127.0.0.1:5000/recursive-thermofluid-sandbox:latest
          imagePullPolicy: Always
          env:
            - name: PORT
              value: "5192"
          ports:
            - name: http
              containerPort: 5192
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 1001
        - name: cloudflared
          image: cloudflare/cloudflared:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: thermofluid-cloudflared-token
                  key: token
          args:
            - tunnel
            - --no-autoupdate
            - run
            - --token
            - $(TUNNEL_TOKEN)
---
apiVersion: v1
kind: Service
metadata:
  name: recursive-thermofluid-sandbox
  namespace: thermofluid
  labels:
    app.kubernetes.io/name: recursive-thermofluid-sandbox
    app.kubernetes.io/part-of: shsw-dev
spec:
  selector:
    app: recursive-thermofluid-sandbox
  ports:
    - name: http
      port: 5192
      targetPort: http
