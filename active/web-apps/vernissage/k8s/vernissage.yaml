apiVersion: v1
kind: Namespace
metadata:
  name: vernissage
---
apiVersion: v1
kind: Secret
metadata:
  name: vernissage-env
  namespace: vernissage
type: Opaque
stringData:
  HOST: "0.0.0.0"
  PORT: "3000"
  NEXTAUTH_URL: "https://thevernissage.art"
  NEXTAUTH_SECRET: "replace-with-a-long-random-secret"
  FEEDBACK_DATABASE_URL: "file:/data/vernissage-feedback.db"
  APP_VERSION: "release-20260407-sqlite-feedback"
---
apiVersion: v1
kind: Secret
metadata:
  name: vernissage-feedback-auth
  namespace: vernissage
type: Opaque
stringData:
  username: "admin"
  password: "replace-with-a-feedback-password"
---
apiVersion: v1
kind: Secret
metadata:
  name: vernissage-db
  namespace: vernissage
type: Opaque
stringData:
  POSTGRES_DB: "vernissage"
  POSTGRES_USER: "vernissage"
  POSTGRES_PASSWORD: "replace-with-a-strong-postgres-password"
  DATABASE_URL: "postgresql://vernissage:replace-with-a-strong-postgres-password@vernissage-postgres:5432/vernissage?schema=public"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vernissage-data
  namespace: vernissage
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vernissage-postgres
  namespace: vernissage
  labels:
    app.kubernetes.io/name: vernissage-postgres
    app.kubernetes.io/part-of: shsw-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vernissage-postgres
  template:
    metadata:
      labels:
        app: vernissage-postgres
        app.kubernetes.io/name: vernissage-postgres
        app.kubernetes.io/part-of: shsw-dev
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: vernissage-db
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: vernissage-db
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vernissage-db
                  key: POSTGRES_PASSWORD
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            tcpSocket:
              port: postgres
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket:
              port: postgres
            periodSeconds: 30
            timeoutSeconds: 3
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: vernissage-postgres-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vernissage-postgres-data
  namespace: vernissage
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: vernissage-postgres
  namespace: vernissage
  labels:
    app.kubernetes.io/name: vernissage-postgres
    app.kubernetes.io/part-of: shsw-dev
spec:
  selector:
    app: vernissage-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vernissage
  namespace: vernissage
  labels:
    app.kubernetes.io/name: vernissage
    app.kubernetes.io/part-of: shsw-dev
    app.kubernetes.io/component: web-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vernissage
  template:
    metadata:
      labels:
        app: vernissage
        app.kubernetes.io/name: vernissage
        app.kubernetes.io/part-of: shsw-dev
    spec:
      securityContext:
        fsGroup: 1001
      initContainers:
        - name: prepare-feedback-storage
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - |
              mkdir -p /data/feedback/addressed
              chown -R 1001:1001 /data
              chmod 775 /data /data/feedback /data/feedback/addressed
              if [ -f /data/vernissage-feedback.db ]; then
                chmod 664 /data/vernissage-feedback.db
              fi
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: vernissage-data
              mountPath: /data
      containers:
        - name: vernissage
          image: 127.0.0.1:5000/vernissage:latest
          imagePullPolicy: Always
          command: ["/bin/sh", "-ec"]
          args:
            - |
              mkdir -p /data/feedback/addressed
              if [ -n "${DATABASE_URL:-}" ]; then
                npx prisma db push --skip-generate
              fi
              exec npm start -- --hostname "${HOST:-0.0.0.0}" --port "${PORT:-3000}"
          env:
            - name: HOST
              valueFrom:
                secretKeyRef:
                  name: vernissage-env
                  key: HOST
            - name: PORT
              valueFrom:
                secretKeyRef:
                  name: vernissage-env
                  key: PORT
            - name: NEXTAUTH_URL
              valueFrom:
                secretKeyRef:
                  name: vernissage-env
                  key: NEXTAUTH_URL
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: vernissage-db
                  key: DATABASE_URL
            - name: NEXTAUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: vernissage-env
                  key: NEXTAUTH_SECRET
            - name: APP_VERSION
              valueFrom:
                secretKeyRef:
                  name: vernissage-env
                  key: APP_VERSION
            - name: FEEDBACK_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: vernissage-env
                  key: FEEDBACK_DATABASE_URL
            - name: FEEDBACK_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: vernissage-feedback-auth
                  key: username
            - name: FEEDBACK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vernissage-feedback-auth
                  key: password
          ports:
            - name: http
              containerPort: 3000
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 1001
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
              ephemeral-storage: 1Gi
            limits:
              cpu: 1000m
              memory: 1Gi
              ephemeral-storage: 2Gi
          startupProbe:
            httpGet:
              path: /api/ready
              port: http
            failureThreshold: 18
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 30
            timeoutSeconds: 3
          volumeMounts:
            - name: vernissage-data
              mountPath: /data
        - name: cloudflared
          image: cloudflare/cloudflared:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vernissage-cloudflared-token
                  key: token
          args:
            - tunnel
            - --no-autoupdate
            - --url
            - http://127.0.0.1:3000
            - run
            - --token
            - $(TUNNEL_TOKEN)
      volumes:
        - name: vernissage-data
          persistentVolumeClaim:
            claimName: vernissage-data
---
apiVersion: v1
kind: Service
metadata:
  name: vernissage
  namespace: vernissage
  labels:
    app.kubernetes.io/name: vernissage
    app.kubernetes.io/part-of: shsw-dev
spec:
  type: NodePort
  selector:
    app: vernissage
  ports:
    - name: http
      port: 3000
      targetPort: http
      nodePort: 30030
