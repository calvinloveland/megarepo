apiVersion: v1
kind: Namespace
metadata:
  name: parambulator
---
apiVersion: v1
kind: Secret
metadata:
  name: parambulator-env
  namespace: parambulator
type: Opaque
stringData:
  SECRET_KEY: "replace-this-secret-key-before-public-use"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: parambulator-data
  namespace: parambulator
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: parambulator
  namespace: parambulator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: parambulator
  template:
    metadata:
      labels:
        app: parambulator
    spec:
      securityContext:
        fsGroup: 1001
      initContainers:
        - name: prepare-app-data
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - |
              mkdir -p /app/data/feedback/addressed /app/data/saves
              chown -R 1001:1001 /app/data
              chmod -R ug+rwX /app/data
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: parambulator-data
              mountPath: /app/data
      containers:
        - name: parambulator
          image: 127.0.0.1:5000/parambulator:latest
          imagePullPolicy: Always
          env:
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: parambulator-env
                  key: SECRET_KEY
            - name: FLASK_DEBUG
              value: "false"
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "5000"
            - name: APP_VERSION
              value: "release-20260222-git-sync"
            - name: FEEDBACK_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: parambulator-feedback-auth
                  key: username
                  optional: true
            - name: FEEDBACK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: parambulator-feedback-auth
                  key: password
                  optional: true
          ports:
            - name: http
              containerPort: 5000
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 1001
          volumeMounts:
            - name: parambulator-data
              mountPath: /app/data
        - name: cloudflared
          image: cloudflare/cloudflared:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: parambulator-cloudflared-token
                  key: token
          args:
            - tunnel
            - --no-autoupdate
            - run
            - --token
            - $(TUNNEL_TOKEN)
      volumes:
        - name: parambulator-data
          persistentVolumeClaim:
            claimName: parambulator-data
---
apiVersion: v1
kind: Service
metadata:
  name: parambulator
  namespace: parambulator
spec:
  selector:
    app: parambulator
  ports:
    - name: http
      port: 5000
      targetPort: http
