[env]
platform = espressif32
board = nodemcu-32s
framework = arduino
board_build.flash_mode = dout
monitor_speed = 115200
upload_speed = 57600

[env:phase1-single-node]
build_src_filter = +<phase1_single_node.cpp>

[env:mic-monitor]
build_src_filter = +<mic_monitor.cpp>

[env:mic-record]
build_src_filter = +<mic_record.cpp>

[env:sync-test]
build_src_filter = +<sync_test.cpp>
