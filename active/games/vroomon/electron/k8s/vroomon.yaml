apiVersion: v1
kind: Namespace
metadata:
  name: vroomon
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vroomon
  namespace: vroomon
  labels:
    app.kubernetes.io/name: vroomon
    app.kubernetes.io/part-of: shsw-dev
    app.kubernetes.io/component: game
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vroomon
  template:
    metadata:
      labels:
        app: vroomon
        app.kubernetes.io/name: vroomon
        app.kubernetes.io/part-of: shsw-dev
    spec:
      # The vroomon container runs scripts/web-server.mjs (Node HTTP) which
      # serves the browser build and the /api/feedback endpoint on 5112.
      containers:
        - name: vroomon
          image: 127.0.0.1:5000/vroomon:latest
          imagePullPolicy: Always
          env:
            - name: VROOMON_WEB_PORT
              value: "5112"
            - name: VROOMON_WEB_HOST
              value: "0.0.0.0"
          ports:
            - name: web
              containerPort: 5112
          readinessProbe:
            httpGet:
              path: /
              port: web
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: web
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: vroomon-data
              mountPath: /data/vroomon
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 1001
            readOnlyRootFilesystem: false
        - name: cloudflared
          image: cloudflare/cloudflared:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vroomon-cloudflared-token
                  key: token
          args:
            - tunnel
            - --no-autoupdate
            - run
            - --token
            - $(TUNNEL_TOKEN)
      volumes:
        - name: vroomon-data
          persistentVolumeClaim:
            claimName: vroomon-data
      securityContext:
        # Make the PVC and the image's .secrets dir writable by UID 1001.
        fsGroup: 1001
---
apiVersion: v1
kind: Service
metadata:
  name: vroomon
  namespace: vroomon
  labels:
    app.kubernetes.io/name: vroomon
    app.kubernetes.io/part-of: shsw-dev
spec:
  selector:
    app: vroomon
  ports:
    - name: web
      port: 5112
      targetPort: web
---
# Persistent storage for future server-side state (Hall of Fame/run state
# persistence from the browser build is not wired yet — the web app keeps
# state per-session in memory). Backed by the k3s default StorageClass; the
# image chowns the mount for UID 1001.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vroomon-data
  namespace: vroomon
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 256Mi