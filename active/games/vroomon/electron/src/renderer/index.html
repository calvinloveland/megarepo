<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>vroomon rewrite</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, system-ui, sans-serif;
        --bg: #08111f;
        --panel: rgba(11, 19, 33, 0.94);
        --panel-strong: rgba(16, 28, 48, 0.98);
        --border: rgba(125, 148, 186, 0.22);
        --border-strong: rgba(138, 180, 255, 0.5);
        --text: #edf2f7;
        --muted: #97abc7;
        --accent: #8ab4ff;
        --accent-strong: #3f82ff;
        --accent-warm: #ffd166;
        --success: #49dcb1;
        --shadow: 0 28px 60px rgba(0, 0, 0, 0.34);
        --overlay-bg: rgba(8, 17, 31, 0.88);
      }

      * { box-sizing: border-box; }

      html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }

      body {
        background:
          radial-gradient(circle at top, rgba(63, 130, 255, 0.22), transparent 28%),
          linear-gradient(180deg, #08111f 0%, #0d1727 100%);
        color: var(--text);
      }

      button, input, select, summary { font: inherit; }

      /* ============ FULL-VIEWPORT VIEWPORT ============ */
      .viewport-stage {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
      }

      .viewport-stage__body {
        flex: 1;
        position: relative;
        overflow: hidden;
      }

      .race-viewport {
        width: 100%;
        height: 100%;
        display: block;
      }

      .overworld-canvas {
        width: 100%;
        height: 100%;
        display: block;
        background: #6f9d4a;
        image-rendering: pixelated;
      }

      /* ============ FLOATING TOP BAR ============ */
      .top-bar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 20;
        display: flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.35rem 0.7rem;
        background: var(--overlay-bg);
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        font-size: 0.85rem;
        color: var(--text);
        pointer-events: none;
      }
      .top-bar > * { pointer-events: auto; }

      .top-bar__tabs { display: flex; gap: 0.25rem; }

      .top-bar__tab {
        border-radius: 12px;
        border: 1px solid rgba(125, 148, 186, 0.28);
        background: rgba(9, 16, 30, 0.92);
        color: var(--muted);
        padding: 0.45rem 0.7rem;
        cursor: pointer;
        font-weight: 600;
        font-size: 0.82rem;
        transition: background 0.15s, color 0.15s, border-color 0.15s;
      }
      .top-bar__tab:hover {
        background: rgba(20, 36, 60, 0.95);
        color: var(--text);
      }
      .top-bar__tab.active {
        background: linear-gradient(180deg, #8ab4ff 0%, #5a90ff 100%);
        border-color: rgba(138, 180, 255, 0.85);
        color: #081120;
        box-shadow: 0 0 0 2px rgba(138, 180, 255, 0.16);
      }

      .top-bar__spacer { flex: 1; }

      .top-bar__terrain select {
        border-radius: 12px;
        border: 1px solid rgba(125, 148, 186, 0.28);
        background: rgba(9, 16, 30, 0.92);
        color: var(--text);
        padding: 0.4rem 0.5rem;
        cursor: pointer;
        font-size: 0.85rem;
      }

      .top-bar__gen {
        display: flex;
        align-items: center;
        gap: 0.4rem;
        background: rgba(9, 16, 30, 0.92);
        border: 1px solid rgba(125, 148, 186, 0.28);
        padding: 0.3rem 0.5rem;
        border-radius: 12px;
        font-size: 0.85rem;
      }
      .top-bar__gen strong { color: var(--accent-warm); }

      /* ============ FLOATING OVERLAYS ============ */
      .viewport-overlay {
        position: absolute;
        z-index: 10;
        pointer-events: none;
      }
      .viewport-overlay > * { pointer-events: auto; }

      .viewport-overlay--actions {
        left: 0.6rem;
        bottom: 0.6rem;
        display: flex;
        flex-direction: column;
        gap: 0.35rem;
        max-width: 320px;
      }
      .viewport-overlay--actions .action-row {
        display: flex;
        gap: 0.35rem;
        flex-wrap: wrap;
      }

      .hud-btn {
        border-radius: 12px;
        border: 1px solid rgba(138, 180, 255, 0.48);
        background: linear-gradient(180deg, #3d7dff 0%, #2256c4 100%);
        color: #fff;
        padding: 0.4rem 0.65rem;
        cursor: pointer;
        font-weight: 600;
        font-size: 0.78rem;
        white-space: nowrap;
        transition: transform 0.06s, box-shadow 0.06s;
      }
      .hud-btn:hover {
        transform: translateY(-1px);
        box-shadow: 0 8px 20px rgba(34, 86, 196, 0.3);
      }
      .hud-btn:active {
        transform: translateY(1px);
      }
      .hud-btn--primary {
        background: linear-gradient(180deg, #49dcb1 0%, #2a8a72 100%);
        border-color: rgba(73, 220, 177, 0.6);
      }
      .hud-btn--secondary {
        background: rgba(32, 46, 70, 0.98);
        border-color: rgba(125, 148, 186, 0.28);
        color: var(--text);
      }

      .hud-input {
        border-radius: 12px;
        border: 1px solid rgba(125, 148, 186, 0.28);
        background: rgba(9, 16, 30, 0.92);
        color: var(--text);
        padding: 0.4rem 0.5rem;
        font-family: monospace;
        font-size: 0.85rem;
        width: 100%;
      }
      .hud-input:focus {
        outline: none;
        border-color: var(--accent-strong);
        box-shadow: 0 0 0 2px rgba(63, 130, 255, 0.25);
      }

      .hud-select {
        border-radius: 12px;
        border: 1px solid rgba(125, 148, 186, 0.28);
        background: rgba(9, 16, 30, 0.92);
        color: var(--text);
        padding: 0.3rem 0.4rem;
        cursor: pointer;
        font-size: 0.78rem;
      }

      .hud-label {
        font-size: 0.75rem;
        color: var(--muted);
        display: block;
        margin-bottom: 0.1rem;
      }

      .hud-row { display: flex; flex-direction: column; gap: 0.15rem; }

      .hud-checkbox {
        display: inline-flex;
        align-items: center;
        gap: 0.3rem;
        font-size: 0.72rem;
        color: var(--muted);
        border: 1px solid rgba(125, 148, 186, 0.28);
        border-radius: 12px;
        background: rgba(9, 16, 30, 0.92);
        padding: 0.2rem 0.4rem;
        cursor: pointer;
        user-select: none;
        white-space: nowrap;
      }

      .viewport-overlay--status {
        top: 3rem;
        right: 0.6rem;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 0.35rem;
      }

      .status-pill {
        background: var(--overlay-bg);
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        color: var(--text);
        border: 1px solid rgba(125, 148, 186, 0.28);
        border-radius: 99px;
        padding: 0.25rem 0.55rem;
        font-size: 0.8rem;
        display: flex;
        align-items: center;
        gap: 0.35rem;
      }
      .status-pill .pill-value { color: var(--accent-warm); font-weight: 700; }

      .viewport-overlay--progress {
        top: 0.5rem;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0, 0, 0, 0.6);
        color: var(--text);
        padding: 0.3rem 0.7rem;
        border-radius: 99px;
        font-size: 0.78rem;
        display: flex;
        align-items: center;
        gap: 0.5rem;
        min-width: 200px;
        max-width: 50%;
      }
      .viewport-overlay--progress .progress-track {
        flex: 1;
        height: 6px;
        background: rgba(125, 148, 186, 0.16);
        border-radius: 99px;
        overflow: hidden;
      }
      .viewport-overlay--progress .progress-fill {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #3d7dff, #8ab4ff);
        transition: width 0.3s ease;
      }

      .viewport-overlay--hof {
        right: 0.6rem;
        bottom: 0.6rem;
        max-width: 200px;
      }
      .viewport-overlay--hof .hof-card {
        background: var(--overlay-bg);
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        color: var(--text);
        border: 1px solid rgba(125, 148, 186, 0.28);
        border-radius: 12px;
        padding: 0.4rem 0.5rem;
        font-size: 0.75rem;
        line-height: 1.3;
      }
      .viewport-overlay--hof .hof-card h4 {
        font-size: 0.8rem;
        margin: 0 0 0.2rem 0;
        color: var(--accent-warm);
      }
      .viewport-overlay--hof .hof-card .hof-row { display: flex; justify-content: space-between; }
      .viewport-overlay--hof .hof-card .hof-row strong { color: var(--accent-warm); }

      .viewport-overlay--dpad { left: 0.6rem; bottom: 0.6rem; }
      .dpad { display: grid; justify-items: center; gap: 0.25rem; }
      .dpad-row { display: flex; gap: 0.25rem; }
      .dpad-btn {
        width: 38px; height: 38px; font-size: 1rem;
        background: rgba(9, 16, 30, 0.92);
        border: 1px solid rgba(125, 148, 186, 0.4);
        color: var(--text);
        cursor: pointer;
        border-radius: 12px;
        display: flex; align-items: center; justify-content: center;
      }
      .dpad-btn:active { transform: translateY(1px); }
      .dpad-interact {
        background: linear-gradient(180deg, #49dcb1, #2a8a72);
        color: #08111f;
        border-color: rgba(73, 220, 177, 0.8);
        font-weight: 700;
      }

      .viewport-overlay--dialogue {
        left: 50%;
        bottom: 4rem;
        transform: translateX(-50%);
        width: min(480px, 80vw);
      }
      .overworld-dialogue {
        background: var(--overlay-bg);
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        border: 1px solid rgba(138, 180, 255, 0.5);
        border-radius: 14px;
        padding: 0.6rem 0.8rem;
        display: grid;
        gap: 0.35rem;
      }
      .overworld-dialogue[hidden] { display: none; }
      .overworld-dialogue__name { font-weight: 700; color: var(--accent-warm); }
      .overworld-dialogue__text { font-size: 0.92rem; line-height: 1.4; }
      .overworld-dialogue__options { display: grid; gap: 0.25rem; }
      .overworld-dialogue__options button {
        background: rgba(20, 36, 60, 0.95);
        border: 1px solid rgba(138, 180, 255, 0.3);
        color: var(--text);
        padding: 0.35rem 0.6rem;
        text-align: left;
        cursor: pointer;
        border-radius: 8px;
        font-size: 0.85rem;
      }
      .overworld-dialogue__options button:hover { background: rgba(40, 70, 110, 0.98); }
      .overworld-dialogue__hint { font-size: 0.7rem; color: var(--muted); text-align: right; font-style: italic; }

      .viewport-overlay--status-msg {
        left: 50%;
        bottom: 0.3rem;
        transform: translateX(-50%);
        font-size: 0.78rem;
        color: var(--muted);
        text-shadow: 0 1px 4px rgba(0,0,0,0.6);
        white-space: nowrap;
        max-width: 90%;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      /* Menu */
      .viewport-overlay--menu {
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        max-width: 500px;
      }
      .menu-title {
        font-size: 2rem;
        font-weight: 800;
        margin: 0 0 0.5rem;
        color: var(--text);
        letter-spacing: 0.02em;
      }
      .menu-tagline { font-size: 0.95rem; color: var(--muted); font-style: italic; }

      /* Error toggle */
      .error-toggle {
        position: fixed; bottom: 0.5rem; right: 0.5rem; z-index: 50;
        width: 32px; height: 32px; border-radius: 50%;
        background: rgba(8, 17, 31, 0.7);
        color: #ff6b4a;
        border: 2px solid #ff6b4a;
        font-size: 0.5rem; cursor: pointer;
        display: flex; align-items: center; justify-content: center;
      }
      .error-toggle[data-has-errors="true"] {
        background: #ff6b4a; color: #fff;
        animation: error-pulse 2s ease-in-out infinite;
      }
      @keyframes error-pulse {
        0%, 100% { box-shadow: 0 0 0 0 rgba(255, 107, 74, 0.6); }
        50% { box-shadow: 0 0 0 8px rgba(255, 107, 74, 0); }
      }
      .error-panel {
        position: fixed; bottom: 3rem; right: 0.5rem;
        width: 360px; max-height: 50vh;
        background: rgba(8, 11, 20, 0.95);
        color: var(--text);
        border: 2px solid #ff6b4a;
        border-radius: 8px; padding: 0.5rem;
        z-index: 49;
        display: none; flex-direction: column; gap: 0.3rem;
        font-size: 0.8rem;
      }
      .error-panel--open { display: flex; }
      .error-panel__head {
        display: flex; justify-content: space-between;
        font-size: 0.75rem; color: #ff6b4a;
        border-bottom: 1px solid rgba(255, 107, 74, 0.3);
        padding-bottom: 0.25rem;
      }
      .error-panel__head button {
        background: transparent; color: var(--accent-warm);
        border: 1px solid var(--accent-warm); padding: 0.15rem 0.3rem;
        cursor: pointer; border-radius: 4px; font-size: 0.7rem;
      }
      .error-list { overflow-y: auto; max-height: 40vh; display: grid; gap: 0.3rem; }
      .error-entry {
        background: rgba(255, 107, 74, 0.08);
        border-left: 3px solid #ff6b4a;
        padding: 0.3rem 0.4rem;
        border-radius: 0 4px 4px 0;
      }
      .error-entry__msg { color: var(--text); word-break: break-word; }
      .error-entry__time { color: var(--muted); font-size: 0.65rem; }

      /* SVG labels */
      .viewport-label {
        font-size: 22px; font-weight: 700;
        fill: #f8fbff; paint-order: stroke;
        stroke: rgba(8, 17, 31, 0.75);
        stroke-width: 5px; stroke-linejoin: round;
      }
      .viewport-subtitle {
        font-size: 14px;
        fill: rgba(255, 255, 255, 0.78);
        paint-order: stroke;
        stroke: rgba(8, 17, 31, 0.6);
        stroke-width: 4px; stroke-linejoin: round;
      }

      @media (max-width: 600px) {
        .top-bar { font-size: 0.75rem; padding: 0.2rem 0.4rem; flex-wrap: wrap; }
        .top-bar__tab { font-size: 0.72rem; padding: 0.3rem 0.5rem; }
        .viewport-overlay--actions { max-width: 220px; }
      }
    </style>
  </head>
  <body>
    <section class="viewport-stage">
      <div class="viewport-stage__body">
        <svg
          class="race-viewport"
          data-race-viewport
          viewBox="0 0 1000 480"
          preserveAspectRatio="xMidYMid meet"
          aria-label="Race viewport"
        ></svg>

        <canvas
          class="overworld-canvas"
          data-overworld-canvas
          style="display:none"
          width="640"
          height="480"
          aria-label="Continent of Vroom overworld"
        ></canvas>

        <!-- Top bar -->
        <nav class="top-bar" data-top-bar>
          <div class="top-bar__tabs">
            <button class="top-bar__tab" type="button" data-mode-button="world">Overworld</button>
            <button class="top-bar__tab" type="button" data-mode-button="evolution">Evolution</button>
            <button class="top-bar__tab" type="button" data-mode-button="test-drive">Test Drive</button>
            <button class="top-bar__tab" type="button" data-mode-button="menu">Menu</button>
          </div>
          <div class="top-bar__spacer"></div>
          <div class="top-bar__terrain">
            <select data-terrain-select></select>
          </div>
          <div class="top-bar__gen" data-viewport-gen-pill>
            <strong data-viewport-gen-value>0</strong>
          </div>
        </nav>

        <!-- Status pills (top-right) -->
        <div class="viewport-overlay viewport-overlay--status">
          <div class="status-pill" data-viewport-leader-pill hidden>
            <span>🏆</span>
            <span class="pill-value" data-viewport-leader-value>—</span>
          </div>
        </div>

        <!-- Batch progress -->
        <div class="viewport-overlay viewport-overlay--progress" data-viewport-progress-overlay hidden>
          <span class="progress-text" data-viewport-progress-text>Batch 0/0</span>
          <div class="progress-track">
            <div class="progress-fill" data-viewport-progress-fill></div>
          </div>
        </div>

        <!-- Evolution actions + collapsible config -->
        <div class="viewport-overlay viewport-overlay--actions" data-viewport-actions-overlay data-mode="evolution" hidden>
          <div class="action-row">
            <button class="hud-btn hud-btn--primary" type="button" data-generate-population>Generate</button>
            <button class="hud-btn" type="button" data-run-generation>Run Gen</button>
            <button class="hud-btn" type="button" data-run-batch-generations>Batch</button>
            <button class="hud-btn hud-btn--secondary" type="button" data-config-toggle style="font-size:0.8rem;line-height:1;padding:0.3rem 0.4rem;" title="Toggle config">⚙</button>
          </div>
          <div data-config-panel hidden style="display:flex;flex-wrap:wrap;gap:0.25rem;margin-top:0.1rem;">
            <select data-population-size-select class="hud-select" style="min-width:60px;">
              <option value="20">20</option>
              <option value="50">50</option>
              <option value="100" selected>100</option>
              <option value="200">200</option>
            </select>
            <select data-dna-length-select class="hud-select" style="min-width:50px;">
              <option value="6">6ch</option>
              <option value="9">9ch</option>
              <option value="12" selected>12ch</option>
              <option value="16">16ch</option>
              <option value="20">20ch</option>
            </select>
            <select data-mutation-rate-select class="hud-select" style="min-width:45px;">
              <option value="0.05">5%</option>
              <option value="0.1" selected>10%</option>
              <option value="0.2">20%</option>
              <option value="0.3">30%</option>
            </select>
            <select data-retain-ratio-select class="hud-select" style="min-width:45px;">
              <option value="0.25">25%</option>
              <option value="0.5" selected>50%</option>
              <option value="0.75">75%</option>
            </select>
            <select data-batch-count-select class="hud-select" style="min-width:35px;"></select>
            <label class="hud-checkbox" style="font-size:0.7rem;padding:0.2rem 0.35rem;">
              <input type="checkbox" data-converge-toggle checked style="width:12px;height:12px;" />
              Plateau
            </label>
          </div>
          <div class="action-row" data-batch-progress hidden>
            <div class="progress-track" style="flex:1;height:5px;background:rgba(125,148,186,0.16);border-radius:99px;overflow:hidden;">
              <div data-batch-progress-fill style="height:100%;width:0%;background:linear-gradient(90deg,#3d7dff,#8ab4ff);transition:width 0.3s;"></div>
            </div>
            <span data-batch-progress-text style="font-size:0.7rem;color:var(--muted);"></span>
          </div>
          <div class="action-row" hidden data-vehicle-strip data-selected-vehicle-buttons style="margin-top:0.15rem;display:flex;gap:0.2rem;flex-wrap:wrap;"></div>
        </div>

        <!-- Test-drive actions -->
        <div class="viewport-overlay viewport-overlay--actions" data-viewport-actions-overlay data-mode="test-drive" hidden>
          <div class="hud-row">
            <span class="hud-label">DNA (press <kbd style="padding:0.1rem 0.3rem;background:rgba(125,148,186,0.16);border-radius:4px;">d</kbd> to randomize)</span>
            <input class="hud-input" type="text" data-dna-input value="A3x9K2m7P4zQ" />
          </div>
          <div class="action-row">
            <button class="hud-btn hud-btn--secondary" type="button" data-watch-flat-track-regression>▶ Replay</button>
            <button class="hud-btn hud-btn--secondary" type="button" data-randomize-dna>🎲 Random</button>
            <button class="hud-btn" type="button" data-save-to-hall>🏅 Save</button>
          </div>
        </div>

        <!-- Hall of Fame (test-drive) -->
        <div class="viewport-overlay viewport-overlay--hof" data-viewport-hof-overlay data-mode="test-drive" hidden>
          <div class="hof-card">
            <h4>🏅 Hall of Fame</h4>
            <div class="hof-row"><span>Top:</span><strong data-hof-top-score>—</strong></div>
            <div class="hof-row"><span>Saved:</span><strong data-hof-count>0</strong></div>
          </div>
        </div>

        <!-- D-pad (world) -->
        <div class="viewport-overlay viewport-overlay--dpad" data-viewport-dpad-overlay data-mode="world" hidden>
          <div class="dpad">
            <button class="dpad-btn" type="button" data-dpad="up">▲</button>
            <div class="dpad-row">
              <button class="dpad-btn" type="button" data-dpad="left">◀</button>
              <button class="dpad-btn" type="button" data-dpad="down">▼</button>
              <button class="dpad-btn" type="button" data-dpad="right">▶</button>
            </div>
            <button class="dpad-btn dpad-interact" type="button" data-dpad="interact">A</button>
          </div>
        </div>

        <!-- Dialogue (world) -->
        <div class="viewport-overlay viewport-overlay--dialogue" data-overworld-dialogue hidden>
          <div class="overworld-dialogue">
            <div class="overworld-dialogue__name" data-overworld-dialogue-name></div>
            <div class="overworld-dialogue__text" data-overworld-dialogue-text></div>
            <div class="overworld-dialogue__options" data-overworld-dialogue-options></div>
            <div class="overworld-dialogue__hint">Z or Enter</div>
          </div>
        </div>

        <!-- Status message -->
        <div class="viewport-overlay viewport-overlay--status-msg" data-status-message>Ready to begin.</div>
      </div>
    </section>

    <!-- Error toggle + panel -->
    <button class="error-toggle" type="button" data-error-toggle data-has-errors="false" aria-label="Toggle error panel">
      <span data-error-badge>0</span>
    </button>
    <div class="error-panel" data-error-panel aria-live="polite">
      <div class="error-panel__head">
        <span>⚠ Errors</span>
        <button type="button" data-error-clear>Clear</button>
      </div>
      <div class="error-list" data-error-list></div>
    </div>

    <!-- Hidden stubs (renderer targets) -->
    <div style="display:none" aria-hidden="true">
      <div data-run-state-output></div>
      <div data-dna-output></div>
      <div data-physics-preview-output></div>
      <div data-evolution-preview-output></div>
      <div data-generation-log-output></div>
