apiVersion: v1
kind: Namespace
metadata:
  name: holdem
---
apiVersion: v1
kind: Secret
metadata:
  name: holdem-env
  namespace: holdem
type: Opaque
stringData:
  FLASK_DEBUG: "false"
  HOST: "0.0.0.0"
  PORT: "5000"
  SECRET_KEY: "replace-this-secret-key-before-public-use"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: holdem
  namespace: holdem
  labels:
    app.kubernetes.io/name: holdem
    app.kubernetes.io/part-of: shsw-dev
    app.kubernetes.io/component: game
spec:
  replicas: 1
  selector:
    matchLabels:
      app: holdem
  template:
    metadata:
      labels:
        app: holdem
        app.kubernetes.io/name: holdem
        app.kubernetes.io/part-of: shsw-dev
    spec:
      securityContext:
        fsGroup: 1001
      containers:
        - name: holdem
          image: 127.0.0.1:5000/holdem:latest
          imagePullPolicy: Always
          env:
            - name: FLASK_DEBUG
              valueFrom:
                secretKeyRef:
                  name: holdem-env
                  key: FLASK_DEBUG
            - name: HOST
              valueFrom:
                secretKeyRef:
                  name: holdem-env
                  key: HOST
            - name: PORT
              valueFrom:
                secretKeyRef:
                  name: holdem-env
                  key: PORT
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: holdem-env
                  key: SECRET_KEY
          ports:
            - name: http
              containerPort: 5000
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 1001
        - name: cloudflared
          image: cloudflare/cloudflared:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: holdem-cloudflared-token
                  key: token
          args:
            - tunnel
            - --no-autoupdate
            - --url
            - http://localhost:5000
            - run
            - --token
            - $(TUNNEL_TOKEN)
---
apiVersion: v1
kind: Service
metadata:
  name: holdem
  namespace: holdem
  labels:
    app.kubernetes.io/name: holdem
    app.kubernetes.io/part-of: shsw-dev
spec:
  selector:
    app: holdem
  ports:
    - name: http
      port: 5000
      targetPort: http
