apiVersion: v1
kind: Namespace
metadata:
  name: wizard
---
apiVersion: v1
kind: Secret
metadata:
  name: wizard-env
  namespace: wizard
type: Opaque
stringData:
  FLASK_DEBUG: "false"
  WIZARD_FIGHT_HOST: "0.0.0.0"
  WIZARD_FIGHT_PORT: "5055"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wizard
  namespace: wizard
  labels:
    app.kubernetes.io/name: wizard
    app.kubernetes.io/part-of: shsw-dev
    app.kubernetes.io/component: game
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wizard
  template:
    metadata:
      labels:
        app: wizard
        app.kubernetes.io/name: wizard
        app.kubernetes.io/part-of: shsw-dev
    spec:
      securityContext:
        fsGroup: 1001
      containers:
        - name: wizard
          image: 127.0.0.1:5000/wizard:latest
          imagePullPolicy: Always
          env:
            - name: FLASK_DEBUG
              valueFrom:
                secretKeyRef:
                  name: wizard-env
                  key: FLASK_DEBUG
            - name: WIZARD_FIGHT_HOST
              valueFrom:
                secretKeyRef:
                  name: wizard-env
                  key: WIZARD_FIGHT_HOST
            - name: WIZARD_FIGHT_PORT
              valueFrom:
                secretKeyRef:
                  name: wizard-env
                  key: WIZARD_FIGHT_PORT
          ports:
            - name: http
              containerPort: 5055
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 1001
        - name: cloudflared
          image: cloudflare/cloudflared:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: wizard-cloudflared-token
                  key: token
          args:
            - tunnel
            - --no-autoupdate
            - --url
            - http://localhost:5055
            - run
            - --token
            - $(TUNNEL_TOKEN)
---
apiVersion: v1
kind: Service
metadata:
  name: wizard
  namespace: wizard
  labels:
    app.kubernetes.io/name: wizard
    app.kubernetes.io/part-of: shsw-dev
spec:
  selector:
    app: wizard
  ports:
    - name: http
      port: 5055
      targetPort: http
