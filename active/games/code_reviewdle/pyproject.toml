[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "code-reviewdle"
version = "0.1.0"
description = "Daily code review puzzle game"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Flask>=2.3",
    "gunicorn>=21.2,<22.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]

[project.scripts]
code-reviewdle = "code_reviewdle.app:main"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
