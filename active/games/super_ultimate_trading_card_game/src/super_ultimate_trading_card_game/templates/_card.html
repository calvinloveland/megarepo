{% macro render_card(raw_card, fallback_kind='unit') -%}
  {% set card = normalize_card(raw_card, fallback_kind) %}
  <article
    class="game-card game-card--{{ card.kind }}"
    {% if card.art_variant_label %}data-card-variant="{{ card.art_variant_label }}"{% endif %}
    {% if card.art_variant_rarity %}data-card-rarity="{{ card.art_variant_rarity }}"{% endif %}
  >
    <img
      class="game-card__image"
      src="{{ card_image_uri(raw_card, fallback_kind) }}"
      alt="{{ card.name }} card"
      loading="lazy"
      decoding="async"
    />
  </article>
{%- endmacro %}
