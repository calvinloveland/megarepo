<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Super Ultimate Trading Card Game{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  </head>
  <body>
    <header class="site-header">
      <div class="wrap">
        <a class="brand" href="{{ url_for('index') }}">Super Ultimate Trading Card Game</a>
        <nav class="nav">
          <a href="{{ url_for('index') }}">Dashboard</a>
          <a href="{{ url_for('cards_index', owner_id=current_player.player_id if current_player else 'alpha') }}">Cards</a>
          <a href="{{ url_for('live_matches_index') }}">Live Games</a>
          <a href="{{ url_for('matches_index') }}">Matches</a>
          {% if current_player %}
            <a href="{{ url_for('collection_detail', owner_id=current_player.player_id) }}">{{ current_player.display_name }}</a>
            <a href="{{ url_for('decks_detail', owner_id=current_player.player_id) }}">My Decks</a>
            <a href="{{ url_for('preferences_detail') }}">Preferences</a>
          {% endif %}
          <a href="{{ url_for('collection_detail', owner_id='alpha') }}">Alpha AI</a>
        </nav>
      </div>
    </header>
    <main class="wrap">
      {% block content %}{% endblock %}
    </main>
    {% block scripts %}{% endblock %}
  </body>
</html>
