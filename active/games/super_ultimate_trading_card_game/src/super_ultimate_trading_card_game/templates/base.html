<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Super Ultimate Trading Card Game{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  </head>
  <body>
    <header class="site-header">
      <div class="wrap">
        <a class="brand" href="{{ url_for('index') }}">Super Ultimate Trading Card Game</a>
        <nav class="nav">
          <a href="{{ url_for('index') }}">Dashboard</a>
          <a href="{{ url_for('matches_index') }}">Matches</a>
          <a href="{{ url_for('collection_detail', owner_id='alpha') }}">Alpha Collection</a>
          <a href="{{ url_for('collection_detail', owner_id='beta') }}">Beta Collection</a>
          <a href="{{ url_for('collection_detail', owner_id='gamma') }}">Gamma Collection</a>
        </nav>
      </div>
    </header>
    <main class="wrap">
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
