
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sky Phoenix Sniper</title>
  <style>body {
  margin: 0;
  font-family: Inter, system-ui, sans-serif;
  background: #10141f;
  color: #eef2ff;
}

.wrap {
  max-width: 1100px;
  margin: 0 auto;
  padding: 1rem;
}

.site-header {
  background: #171d2d;
  border-bottom: 1px solid #2d3752;
}

.brand {
  color: #fff;
  font-weight: 700;
  text-decoration: none;
  font-size: 1.2rem;
}

.nav {
  display: flex;
  gap: 1rem;
  margin-top: 0.75rem;
  flex-wrap: wrap;
}

.nav a {
  color: #bcd0ff;
  text-decoration: none;
}

.grid.two {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
  gap: 1rem;
  margin-bottom: 1rem;
}

.panel {
  background: #171d2d;
  border: 1px solid #2d3752;
  border-radius: 10px;
  padding: 1rem;
  margin-bottom: 1rem;
}

.panel.narrow {
  max-width: 34rem;
  margin: 2rem auto;
}

.stack {
  display: grid;
  gap: 0.75rem;
}

.compact-section {
  gap: 0.5rem;
}

label {
  display: grid;
  gap: 0.35rem;
}

input,
select,
textarea,
button {
  font: inherit;
  border-radius: 8px;
  border: 1px solid #3a4667;
  background: #0f1422;
  color: #eef2ff;
  padding: 0.65rem 0.75rem;
}

button {
  background: #5668f6;
  border-color: #5668f6;
  font-weight: 600;
  cursor: pointer;
}

button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.inline {
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

table {
  width: 100%;
  border-collapse: collapse;
}

th,
td {
  padding: 0.65rem;
  border-bottom: 1px solid #2d3752;
  text-align: left;
}

a {
  color: #9cc5ff;
}

.output,
.log,
pre {
  background: #0c101b;
  border-radius: 8px;
  padding: 0.75rem;
  overflow-x: auto;
  white-space: pre-wrap;
}

.collection-list {
  display: grid;
  gap: 0.75rem;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
}

.collection-list.wide,
.board-list {
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
}

.print-grid {
  display: grid;
  gap: 1rem;
  grid-template-columns: repeat(auto-fit, minmax(420px, 1fr));
}

.print-card {
  display: grid;
  gap: 0.85rem;
  padding: 0.85rem;
  border: 1px solid #2d3752;
  border-radius: 12px;
  background: #0f1422;
}

.print-card__header {
  display: grid;
  gap: 0.2rem;
}

.print-card__header h2,
.print-card__header p {
  margin: 0;
}

.print-card__header p {
  color: #b9c7e8;
}

.print-card .game-card {
  width: min(100%, 22rem);
  margin: 0 auto;
}

.match-seat-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
  gap: 1rem;
  margin-bottom: 1rem;
}

.match-seat p {
  margin: 0;
}

.battlefield-panel {
  overflow: hidden;
}

.battlefield {
  display: grid;
  grid-template-columns: minmax(180px, 220px) minmax(0, 1fr) minmax(180px, 220px);
  gap: 1rem;
  align-items: stretch;
}

.battlefield__base {
  display: grid;
  gap: 0.65rem;
  padding: 0.9rem;
  border-radius: 12px;
  background: #171d2d;
  border: 1px solid #32405d;
}

.battlefield__base h3,
.battlefield-track__header h3 {
  margin: 0;
}

.battlefield__base p,
.battlefield-track__header p {
  margin: 0;
}

.battlefield__base--right {
  text-align: right;
}

.battlefield__base-card {
  width: min(100%, 12.5rem);
}

.battlefield__base--right .battlefield__base-card {
  margin-left: auto;
}

.battlefield__tracks {
  display: grid;
  gap: 1rem;
}

.battlefield-track {
  display: grid;
  gap: 0.75rem;
}

.battlefield-track__header {
  display: grid;
  gap: 0.5rem;
}

.battlefield-track__markers {
  position: relative;
  height: 1.35rem;
  margin: 0 3.75rem;
}

.battlefield-track__marker {
  position: absolute;
  transform: translateX(-50%);
  font-size: 0.72rem;
  color: #8ea6d8;
}

.battlefield-track__marker::after {
  content: "";
  position: absolute;
  left: 50%;
  top: 1rem;
  width: 1px;
  height: 0.8rem;
  background: rgba(156, 197, 255, 0.28);
}

.battlefield-track__lane {
  position: relative;
  min-height: 22rem;
  margin: 0 0.4rem;
  border-radius: 18px;
  background:
    linear-gradient(180deg, rgba(26, 33, 51, 0.96), rgba(18, 23, 37, 0.96)),
    linear-gradient(90deg, rgba(156, 197, 255, 0.08) 0%, rgba(156, 197, 255, 0.02) 100%);
  border: 1px solid #334769;
  overflow: visible;
}

.battlefield-track__line {
  position: absolute;
  left: 3.75rem;
  right: 3.75rem;
  top: 50%;
  height: 4px;
  border-radius: 999px;
  background: linear-gradient(90deg, #6aa6ff 0%, #b7d4ff 50%, #ffb3c8 100%);
  box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08);
}

.battlefield-track__line::before,
.battlefield-track__line::after {
  content: "";
  position: absolute;
  top: 50%;
  width: 2.4rem;
  height: 2px;
  background: rgba(156, 197, 255, 0.55);
}

.battlefield-track__line::before {
  right: 100%;
}

.battlefield-track__line::after {
  left: 100%;
}

.battlefield-track__card {
  position: absolute;
  width: 10rem;
  transform: translateX(-50%);
  z-index: 2;
}

.battlefield-track__card--left {
  top: 1rem;
}

.battlefield-track__card--right {
  bottom: 1rem;
}

.battlefield-track__card .game-card {
  border-width: 2px;
  border-radius: 16px;
}

.battlefield-track__card .game-card__art img {
  min-height: 0;
}

.battlefield-track__card .game-card__body {
  gap: 0.4rem;
  padding: 0.65rem;
}

.battlefield-track__card .game-card__header h3 {
  font-size: 0.9rem;
}

.battlefield-track__card .game-card__header p,
.battlefield-track__card .game-card__keywords,
.battlefield-track__card .game-card__meta,
.battlefield-track__card .game-card__ability {
  display: block;
  font-size: 0.73rem;
}

.battlefield-track__card .game-card__stats {
  gap: 0.32rem;
}

.battlefield-track__card .game-card__stats dt {
  font-size: 0.6rem;
}

.battlefield-track__card .game-card__stats dd {
  font-size: 0.78rem;
}

.battlefield-track__position {
  display: inline-flex;
  margin-bottom: 0.35rem;
  padding: 0.15rem 0.4rem;
  border-radius: 999px;
  background: rgba(12, 16, 27, 0.88);
  color: #eef2ff;
  font-size: 0.66rem;
  font-weight: 700;
}

.battlefield-track__card--played {
  animation: battlefield-card-play 420ms ease-out;
}

.battlefield-track__card--engaged {
  animation: battlefield-card-engaged 900ms ease-in-out infinite alternate;
}

.battlefield-track__card--engaged .battlefield-track__position {
  background: rgba(122, 21, 35, 0.92);
}

.battlefield-track__empty {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  margin: 0;
  color: #9ab1dc;
}

.ownership-card {
  display: block;
  transform-origin: center center;
}

.ownership-card--flipped {
  transform: rotate(180deg);
}

.hand-fan {
  display: flex;
  align-items: flex-end;
  justify-content: center;
  min-height: 24rem;
  padding: 1.5rem 2rem 0.75rem;
  overflow-x: auto;
}

.hand-fan__card {
  width: 11rem;
  margin-left: -5rem;
  transform-origin: bottom center;
  transform: rotate(var(--fan-angle)) translateY(0);
  transition: transform 140ms ease, z-index 140ms ease, filter 140ms ease;
  filter: drop-shadow(0 10px 16px rgba(0, 0, 0, 0.35));
}

.hand-fan__card:first-child {
  margin-left: 0;
}

.hand-fan__card .game-card {
  border-width: 2px;
  border-radius: 18px;
}

.hand-fan__card .game-card__art img {
  min-height: 0;
}

.hand-fan__card .game-card__body {
  gap: 0.45rem;
  padding: 0.72rem;
}

.hand-fan__card .game-card__header h3 {
  font-size: 0.98rem;
}

.hand-fan__card .game-card__header p,
.hand-fan__card .game-card__keywords,
.hand-fan__card .game-card__meta,
.hand-fan__card .game-card__ability {
  display: block;
  font-size: 0.8rem;
}

.hand-fan__card .game-card__stats dt {
  font-size: 0.62rem;
}

.hand-fan__card .game-card__stats dd {
  font-size: 0.82rem;
}

.hand-fan__card:hover {
  transform: rotate(var(--fan-angle)) translateY(-1.1rem) scale(1.16);
  z-index: 5;
}

.hand-fan__card--flipped {
  transform: rotate(calc(180deg + var(--fan-angle))) translateY(0);
}

.hand-fan__card--flipped:hover {
  transform: rotate(calc(180deg + var(--fan-angle))) translateY(-1.1rem) scale(1.16);
}

@keyframes battlefield-card-play {
  0% {
    opacity: 0;
    transform: translateX(-50%) translateY(2rem) scale(0.82);
  }
  60% {
    opacity: 1;
    transform: translateX(-50%) translateY(-0.25rem) scale(1.04);
  }
  100% {
    opacity: 1;
    transform: translateX(-50%) translateY(0) scale(1);
  }
}

@keyframes battlefield-card-engaged {
  0% {
    filter: drop-shadow(0 0 0 rgba(255, 72, 105, 0.0));
  }
  100% {
    filter: drop-shadow(0 0 14px rgba(255, 72, 105, 0.7));
  }
}

@media (max-width: 980px) {
  .battlefield {
    grid-template-columns: 1fr;
  }

  .battlefield__base--right {
    text-align: left;
  }

  .battlefield-track__line::before,
  .battlefield-track__line::after {
    display: none;
  }
}

.card-block {
  background: #0f1422;
  border: 1px solid #2d3752;
  border-radius: 8px;
  padding: 0.75rem;
}

.game-card {
  display: grid;
  grid-template-rows: auto auto 1fr;
  width: 100%;
  aspect-ratio: 5 / 7;
  border-radius: 24px;
  overflow: hidden;
  background: #ead5a1;
  border: 4px solid #9d7d3a;
  box-shadow:
    inset 0 0 0 2px rgba(255, 247, 223, 0.45),
    0 16px 28px rgba(0, 0, 0, 0.32);
  color: #2b1e0f;
}

.game-card--base {
  background: #dbe5f5;
  border-color: #6f87b3;
}

.game-card__titlebar {
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: stretch;
  gap: 0.5rem;
  padding: 0.65rem 0.75rem 0.38rem;
}

.game-card__nameplate {
  min-width: 0;
  display: grid;
  gap: 0.1rem;
  padding: 0.44rem 0.72rem 0.46rem;
  border-radius: 14px;
  background: rgba(246, 236, 209, 0.97);
  border: 1px solid rgba(122, 96, 40, 0.28);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.72);
}

.game-card__nameplate h3 {
  margin: 0;
  font-family: Georgia, "Times New Roman", serif;
  font-size: 1.08rem;
  line-height: 1.05;
}

.game-card__nameplate p {
  margin: 0;
  color: #695634;
  font-size: 0.73rem;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.game-card__vital {
  min-width: 3.45rem;
  display: grid;
  align-content: center;
  justify-items: center;
  padding: 0.4rem 0.35rem 0.42rem;
  border-radius: 999px;
  background: #f0ddb0;
  border: 1px solid rgba(122, 96, 40, 0.3);
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.76),
    0 2px 6px rgba(70, 48, 13, 0.18);
}

.game-card__vital dt,
.game-card__vital dd {
  margin: 0;
}

.game-card__vital dt {
  font-size: 0.58rem;
  letter-spacing: 0.1em;
  color: #7a6336;
}

.game-card__vital dd {
  font-family: Georgia, "Times New Roman", serif;
  font-size: 1rem;
  font-weight: 700;
}

.game-card__art-shell {
  padding: 0 0.75rem;
}

.game-card__art {
  position: relative;
  height: 100%;
  min-height: 13.2rem;
  padding: 0.34rem;
  background: #5b4319;
  border: 1px solid rgba(75, 53, 16, 0.48);
  border-radius: 16px;
  box-shadow:
    inset 0 0 0 1px rgba(255, 241, 203, 0.28),
    0 4px 10px rgba(0, 0, 0, 0.2);
}

.game-card__art img {
  display: block;
  width: 100%;
  height: 100%;
  min-height: 0;
  object-fit: cover;
  border-radius: 12px;
  border: 2px solid rgba(255, 245, 221, 0.72);
}

.game-card__type {
  position: absolute;
  top: 0.65rem;
  right: 0.65rem;
  background: rgba(16, 20, 31, 0.82);
  color: #eef2ff;
  border-radius: 999px;
  padding: 0.2rem 0.55rem;
  font-size: 0.72rem;
  letter-spacing: 0.08em;
  font-weight: 700;
}

.game-card__rarity,
.game-card__variant {
  position: absolute;
  left: 0.65rem;
  background: rgba(247, 233, 181, 0.94);
  color: #3c2d08;
  border-radius: 999px;
  padding: 0.18rem 0.55rem;
  font-size: 0.68rem;
  letter-spacing: 0.05em;
  font-weight: 800;
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.22);
}

.game-card__rarity {
  top: 0.65rem;
}

.game-card__variant {
  bottom: 0.65rem;
  max-width: calc(100% - 1.3rem);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.game-card__body {
  display: grid;
  gap: 0.48rem;
  align-content: start;
  padding: 0.62rem 0.75rem 0.8rem;
  border-top: 1px solid rgba(121, 91, 38, 0.16);
}

.game-card__stats {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 0.32rem;
  margin: 0;
}

.game-card__stats div {
  background: rgba(255, 251, 238, 0.96);
  border: 1px solid rgba(117, 90, 39, 0.2);
  border-radius: 10px;
  padding: 0.3rem 0.34rem 0.34rem;
  text-align: center;
}

.game-card__stats dt {
  margin: 0;
  font-size: 0.55rem;
  letter-spacing: 0.08em;
  color: #6c5a36;
}

.game-card__stats dd {
  margin: 0.1rem 0 0;
  font-size: 0.76rem;
  font-weight: 700;
}

.game-card__keywords,
.game-card__meta,
.game-card__ability {
  margin: 0;
}

.game-card__keywords {
  min-height: 1.55rem;
  padding: 0.34rem 0.52rem;
  border-radius: 10px;
  background: rgba(255, 251, 238, 0.88);
  border: 1px solid rgba(117, 90, 39, 0.14);
  font-size: 0.71rem;
  color: #6f5532;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.game-card__meta {
  font-size: 0.68rem;
  color: #6f5532;
}

.game-card__ability {
  min-height: 3.5rem;
  background: rgba(245, 236, 210, 0.97);
  border: 1px solid rgba(117, 90, 39, 0.16);
  border-radius: 12px;
  padding: 0.55rem 0.6rem;
  line-height: 1.28;
  font-size: 0.76rem;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.75);
}

.inline-form {
  display: inline-flex;
  margin-right: 0.75rem;
  margin-bottom: 0.75rem;
}

fieldset.compact {
  border: 1px solid #2d3752;
  border-radius: 8px;
  padding: 0.75rem;
}

legend {
  padding: 0 0.35rem;
}

hr {
  border: 0;
  border-top: 1px solid #2d3752;
  margin: 1rem 0;
}

.deck-builder-layout {
  display: grid;
  grid-template-columns: minmax(0, 2fr) minmax(280px, 1fr);
  gap: 1rem;
  margin-bottom: 1rem;
}

.deck-builder-panel {
  display: grid;
  gap: 1rem;
  align-content: start;
}

.deck-builder-section {
  display: grid;
  gap: 0.85rem;
}

.deck-builder-section__header {
  display: grid;
  gap: 0.25rem;
}

.deck-builder-section__header h2,
.deck-builder-section__header p,
.deck-slot__header h3 {
  margin: 0;
}

.deck-slot-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 1rem;
}

.deck-slot {
  display: grid;
  gap: 0.55rem;
}

.deck-slot__header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 0.75rem;
}

.deck-slot__clear,
.deck-dropzone__clear {
  width: fit-content;
  padding: 0.4rem 0.65rem;
  background: #26324d;
  border-color: #344666;
}

.deck-dropzone {
  min-height: 22rem;
  padding: 0.75rem;
  border: 2px dashed #42567f;
  border-radius: 16px;
  background: #101726;
  transition: border-color 120ms ease, background 120ms ease, box-shadow 120ms ease;
}

.deck-dropzone--base {
  min-height: 24rem;
}

.deck-dropzone--active {
  border-color: #9cc5ff;
  background: #162033;
  box-shadow: 0 0 0 3px rgba(156, 197, 255, 0.16);
}

.deck-dropzone__content {
  min-height: 100%;
  display: grid;
  place-items: start center;
}

.deck-dropzone__placeholder {
  margin: 0;
  color: #9ab1dc;
  text-align: center;
}

.deck-assigned-card,
.deck-pool-card {
  width: min(100%, 14rem);
  max-width: 14rem;
  cursor: grab;
}

.deck-pool {
  display: flex;
  flex-wrap: wrap;
  gap: 0.9rem;
  justify-content: center;
}

.deck-browser {
  display: grid;
  gap: 1rem;
}

.deck-browser__header {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  gap: 1rem;
}

.deck-browser__header h2,
.deck-browser__header p {
  margin: 0;
}

.deck-filter-controls {
  display: flex;
  flex-wrap: wrap;
  gap: 0.75rem;
  align-items: end;
}

.deck-filter-controls label {
  min-width: 12rem;
}

.deck-browser__pool {
  display: flex;
  flex-wrap: wrap;
  gap: 1rem;
  justify-content: center;
  align-items: flex-start;
}

.deck-pool-card {
  flex: 0 0 14rem;
}

@media (max-width: 980px) {
  .deck-builder-layout {
    grid-template-columns: 1fr;
  }
}
</style>
