apiVersion: v1
kind: Namespace
metadata:
  name: tcg
---
apiVersion: v1
kind: Secret
metadata:
  name: tcg-env
  namespace: tcg
type: Opaque
stringData:
  FLASK_DEBUG: "false"
  HOST: "0.0.0.0"
  PORT: "5000"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tcg-data
  namespace: tcg
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tcg
  namespace: tcg
  labels:
    app.kubernetes.io/name: tcg
    app.kubernetes.io/part-of: shsw-dev
    app.kubernetes.io/component: game
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tcg
  template:
    metadata:
      labels:
        app: tcg
        app.kubernetes.io/name: tcg
        app.kubernetes.io/part-of: shsw-dev
    spec:
      securityContext:
        fsGroup: 1001
      initContainers:
        - name: prepare-app-data
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - |
              mkdir -p /app/data/feedback/addressed /app/data/saves
              chown -R 1001:1001 /app/data
              chmod -R ug+rwX /app/data
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: tcg-data
              mountPath: /app/data
      containers:
        - name: tcg
          image: 127.0.0.1:5000/tcg:latest
          imagePullPolicy: Always
          env:
            - name: FLASK_DEBUG
              valueFrom:
                secretKeyRef:
                  name: tcg-env
                  key: FLASK_DEBUG
            - name: HOST
              valueFrom:
                secretKeyRef:
                  name: tcg-env
                  key: HOST
            - name: PORT
              valueFrom:
                secretKeyRef:
                  name: tcg-env
                  key: PORT
          ports:
            - name: http
              containerPort: 5000
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 1001
          volumeMounts:
            - name: tcg-data
              mountPath: /app/data
        - name: cloudflared
          image: cloudflare/cloudflared:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: tcg-cloudflared-token
                  key: token
          args:
            - tunnel
            - --no-autoupdate
            - --url
            - http://localhost:5000
            - run
            - --token
            - $(TUNNEL_TOKEN)
      volumes:
        - name: tcg-data
          persistentVolumeClaim:
            claimName: tcg-data
---
apiVersion: v1
kind: Service
metadata:
  name: tcg
  namespace: tcg
  labels:
    app.kubernetes.io/name: tcg
    app.kubernetes.io/part-of: shsw-dev
spec:
  selector:
    app: tcg
  ports:
    - name: http
      port: 5000
      targetPort: http
