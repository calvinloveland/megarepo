<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Conway's Game of War — Select Player</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      body, html {
        height: 100%;
        margin: 0;
        overflow: hidden;
        overscroll-behavior: none;
        font-family: system-ui, -apple-system, sans-serif;
        background: #111;
        color: #eee;
        display: flex;
        align-items: center;
        justify-content: center;
        user-select: none;
        -webkit-user-select: none;
      }
      .select-card {
        background: #1a1a1a;
        border: 1px solid #333;
        border-radius: 12px;
        padding: 32px 40px;
        max-width: 480px;
        width: 90%;
        box-shadow: 0 8px 32px rgba(0,0,0,0.6);
      }
      .select-card h1 {
        margin: 0 0 4px 0;
        font-size: 1.4rem;
        font-weight: 600;
        text-align: center;
      }
      .select-card .subtitle {
        text-align: center;
        color: #888;
        font-size: 0.85rem;
        margin: 0 0 24px 0;
      }
      .form-section {
        margin-bottom: 20px;
      }
      .form-section h2 {
        font-size: 0.9rem;
        font-weight: 500;
        color: #aaa;
        margin: 0 0 10px 0;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .color-row {
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
      }
      .color-picker {
        display: flex;
        align-items: center;
        gap: 8px;
        flex: 1;
        min-width: 140px;
      }
      .color-picker label {
        font-size: 0.85rem;
        color: #ccc;
      }
      .color-picker input[type="color"] {
        width: 40px;
        height: 40px;
        border: 2px solid #444;
        border-radius: 6px;
        padding: 2px;
        background: #222;
        cursor: pointer;
      }
      .color-picker input[type="color"]::-webkit-color-swatch-wrapper {
        padding: 0;
      }
      .color-picker input[type="color"]::-webkit-color-swatch {
        border: none;
        border-radius: 3px;
      }
      .btn-group {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .btn-group .btn {
        flex: 1;
        min-width: 100px;
        padding: 10px 16px;
        border: 1px solid #555;
        border-radius: 6px;
        background: #2a2a2a;
        color: #eee;
        font-size: 0.9rem;
        cursor: pointer;
        transition: background 0.15s, border-color 0.15s, transform 0.1s;
        text-align: center;
      }
      .btn-group .btn:hover {
        background: #3a3a3a;
        border-color: #777;
      }
      .btn-group .btn:active {
        transform: scale(0.97);
      }
      .btn-group .btn.primary {
        background: #1a3a5c;
        border-color: #2a6a9c;
        font-weight: 600;
      }
      .btn-group .btn.primary:hover {
        background: #204a7c;
      }
      .btn-group .btn.ai-easy { border-left: 3px solid #4caf50; }
      .btn-group .btn.ai-medium { border-left: 3px solid #ff9800; }
      .btn-group .btn.ai-hard { border-left: 3px solid #f44336; }
      .ai-note {
        text-align: center;
        font-size: 0.75rem;
        color: #666;
        margin: 12px 0 0 0;
      }
      .footer-links {
        text-align: center;
        margin-top: 20px;
        font-size: 0.75rem;
        color: #555;
      }
      .footer-links a {
        color: #777;
        text-decoration: none;
      }
      .footer-links a:hover {
        color: #aaa;
      }
    </style>
  </head>
  <body>
    <div class="select-card">
      <h1>⚔ Conway's Game of War</h1>
      <p class="subtitle">Claim territory, grow your civilization, conquer the board</p>
      <form action="/set_player" method="post">
        <div class="form-section">
          <h2>Colors</h2>
          <div class="color-row">
            <div class="color-picker">
              <label for="player1_color">Player 1</label>
              <input type="color" id="player1_color" name="player1_color" value="#ff0000">
            </div>
            <div class="color-picker">
              <label for="player2_color">Player 2</label>
              <input type="color" id="player2_color" name="player2_color" value="#2266ff">
            </div>
          </div>
        </div>

        <div class="form-section">
          <h2>Play as</h2>
          <div class="btn-group">
            <button type="submit" class="btn primary" name="player" value="player1" style="border-left: 3px solid #ff0000;">Player 1</button>
            <button type="submit" class="btn primary" name="player" value="player2" style="border-left: 3px solid #2266ff;">Player 2</button>
          </div>
        </div>

        <div class="form-section">
          <h2>AI Opponent</h2>
          <div class="btn-group">
            <button type="submit" class="btn ai-easy" name="ai_difficulty" value="easy">🤖 Easy</button>
            <button type="submit" class="btn ai-medium" name="ai_difficulty" value="medium">🧠 Medium</button>
            <button type="submit" class="btn ai-hard" name="ai_difficulty" value="hard">🔥 Hard</button>
          </div>
          <p class="ai-note">The AI plays the opposite side. Select a difficulty or leave blank for local hot-seat.</p>
        </div>
      </form>
      <div class="footer-links">
        <span>Pan: drag · Zoom: scroll / pinch · Double-click: zoom in · <kbd>0</kbd> reset</span>
      </div>
    </div>
  </body>
</html>
