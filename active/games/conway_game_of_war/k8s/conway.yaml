apiVersion: v1
kind: Namespace
metadata:
  name: conway
---
apiVersion: v1
kind: Secret
metadata:
  name: conway-env
  namespace: conway
type: Opaque
stringData:
  FLASK_DEBUG: "false"
  HOST: "0.0.0.0"
  PORT: "5000"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: conway
  namespace: conway
  labels:
    app.kubernetes.io/name: conway
    app.kubernetes.io/part-of: shsw-dev
    app.kubernetes.io/component: game
spec:
  replicas: 1
  selector:
    matchLabels:
      app: conway
  template:
    metadata:
      labels:
        app: conway
        app.kubernetes.io/name: conway
        app.kubernetes.io/part-of: shsw-dev
    spec:
      securityContext:
        fsGroup: 1001
      containers:
        - name: conway
          image: 127.0.0.1:5000/conway:latest
          imagePullPolicy: Always
          env:
            - name: FLASK_DEBUG
              valueFrom:
                secretKeyRef:
                  name: conway-env
                  key: FLASK_DEBUG
            - name: HOST
              valueFrom:
                secretKeyRef:
                  name: conway-env
                  key: HOST
            - name: PORT
              valueFrom:
                secretKeyRef:
                  name: conway-env
                  key: PORT
          ports:
            - name: http
              containerPort: 5000
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 1001
        - name: cloudflared
          image: cloudflare/cloudflared:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: conway-cloudflared-token
                  key: token
          args:
            - tunnel
            - --no-autoupdate
            - --url
            - http://localhost:5000
            - run
            - --token
            - $(TUNNEL_TOKEN)
---
apiVersion: v1
kind: Service
metadata:
  name: conway
  namespace: conway
  labels:
    app.kubernetes.io/name: conway
    app.kubernetes.io/part-of: shsw-dev
spec:
  selector:
    app: conway
  ports:
    - name: http
      port: 5000
      targetPort: http
