[env:node0]
platform = espressif32
board = nodemcu-32s
framework = arduino
board_build.flash_mode = dout
monitor_speed = 115200
build_flags =
    -DCONFIG_NODE_ID=0

[env:node1]
platform = espressif32
board = nodemcu-32s
framework = arduino
board_build.flash_mode = dout
monitor_speed = 115200
upload_speed = 115200
build_flags =
    -DCONFIG_NODE_ID=1

[env:node2]
platform = espressif32
board = nodemcu-32s
framework = arduino
board_build.flash_mode = dout
monitor_speed = 115200
upload_speed = 115200
build_flags =
    -DCONFIG_NODE_ID=2

[env:speaker-test]
platform = espressif32
board = nodemcu-32s
framework = arduino
board_build.flash_mode = dout
monitor_speed = 115200
upload_speed = 57600
build_src_filter = +<speaker_test.cpp>
