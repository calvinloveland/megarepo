<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TSP Brute Force – Distance Histogram</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface2: #334155;
      --border: #475569;
      --text: #f1f5f9;
      --text-dim: #94a3b8;
      --accent: #38bdf8;
      --accent2: #f472b6;
      --green: #4ade80;
      --amber: #fbbf24;
      --radius: 12px;
      --shadow: 0 4px 24px rgba(0,0,0,.4);
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 24px;
    }

    .container {
      max-width: 1200px;
      width: 100%;
    }

    /* ── header ── */
    header {
      text-align: center;
      margin-bottom: 28px;
    }
    header h1 {
      font-size: 1.65rem;
      font-weight: 600;
      letter-spacing: -.02em;
    }
    header h1 span { color: var(--accent); }
    header p {
      color: var(--text-dim);
      font-size: .92rem;
      margin-top: 4px;
    }

    /* ── controls ── */
    .controls {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 24px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 20px;
      margin-bottom: 24px;
      box-shadow: var(--shadow);
    }
    .controls label {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: .9rem;
      color: var(--text-dim);
    }
    .controls label span.val {
      color: var(--text);
      font-weight: 600;
      min-width: 24px;
      text-align: center;
    }
    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 140px;
      height: 6px;
      border-radius: 3px;
      background: var(--surface2);
      outline: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 18px; height: 18px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
      border: 2px solid var(--surface);
      box-shadow: 0 0 0 1px var(--accent);
    }
    input[type="range"]::-moz-range-thumb {
      width: 18px; height: 18px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
      border: 2px solid var(--surface);
    }

    .btn {
      background: var(--accent);
      color: #0f172a;
      border: none;
      border-radius: 8px;
      padding: 8px 20px;
      font-weight: 600;
      font-size: .85rem;
      cursor: pointer;
      transition: filter .15s, transform .1s;
    }
    .btn:hover { filter: brightness(1.15); }
    .btn:active { transform: scale(.97); }
    .btn:disabled {
      opacity: .5;
      cursor: not-allowed;
      filter: none;
    }
    .btn-outline {
      background: transparent;
      color: var(--accent);
      border: 1px solid var(--accent);
    }
    .btn-outline:hover { background: rgba(56,189,248,.1); }

    .status-msg {
      margin-left: auto;
      font-size: .85rem;
      color: var(--text-dim);
    }
    .status-msg .spin {
      display: inline-block;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── grid: map + chart ── */
    .grid {
      display: grid;
      grid-template-columns: 380px 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }
    @media (max-width: 860px) {
      .grid { grid-template-columns: 1fr; }
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow);
    }
    .card h2 {
      font-size: .85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .05em;
      color: var(--text-dim);
      margin-bottom: 12px;
    }

    #mapCanvas {
      width: 100%;
      aspect-ratio: 1 / 1;
      display: block;
      border-radius: 8px;
      background: #0b1120;
    }

    #chartCanvas {
      width: 100% !important;
      max-height: 348px;
    }

    /* ── stats ── */
    .stats {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 24px;
      box-shadow: var(--shadow);
      display: flex;
      flex-wrap: wrap;
      gap: 8px 32px;
    }
    .stat-item {
      display: flex;
      align-items: baseline;
      gap: 6px;
    }
    .stat-item .lbl {
      font-size: .78rem;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: .04em;
    }
    .stat-item .val {
      font-size: 1.05rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }
    .stat-item .val.green  { color: var(--green); }
    .stat-item .val.amber  { color: var(--amber); }
    .stat-item .val.accent { color: var(--accent); }
    .stat-item .val.pink   { color: var(--accent2); }
    .val-unit {
      font-size: .75rem;
      color: var(--text-dim);
      margin-left: 2px;
    }

    /* ── footer note ── */
    .footnote {
      text-align: center;
      color: var(--text-dim);
      font-size: .78rem;
      margin-top: 20px;
    }
    .footnote a { color: var(--accent); }
  </style>
</head>
<body>
<div class="container">

  <!-- HEADER -->
  <header>
    <h1>TSP <span>Brute Force</span></h1>
    <p>Every possible tour &middot; Distance histogram</p>
  </header>

  <!-- CONTROLS -->
  <div class="controls">
    <label>
      Cities
      <input type="range" id="citySlider" min="4" max="10" value="8" step="1">
      <span class="val" id="cityVal">8</span>
    </label>
    <button class="btn" id="solveBtn">⟳ Solve</button>
    <button class="btn btn-outline" id="randomBtn">🎲 Randomize</button>
    <span class="status-msg" id="statusMsg">Ready</span>
  </div>

  <!-- GRID -->
  <div class="grid">
    <div class="card">
      <h2>📍 Cities &amp; Optimal Tour</h2>
      <canvas id="mapCanvas" width="400" height="400"></canvas>
    </div>
    <div class="card">
      <h2>📊 Distance Histogram</h2>
      <canvas id="chartCanvas"></canvas>
    </div>
  </div>

  <!-- STATS -->
  <div class="stats" id="statsRow">
    <div class="stat-item"><span class="lbl">Tours</span><span class="val accent" id="statCount">—</span></div>
    <div class="stat-item"><span class="lbl">Min</span><span class="val green" id="statMin">—</span><span class="val-unit">units</span></div>
    <div class="stat-item"><span class="lbl">Max</span><span class="val amber" id="statMax">—</span><span class="val-unit">units</span></div>
    <div class="stat-item"><span class="lbl">Mean</span><span class="val" id="statMean">—</span><span class="val-unit">units</span></div>
    <div class="stat-item"><span class="lbl">Median</span><span class="val pink" id="statMedian">—</span><span class="val-unit">units</span></div>
    <div class="stat-item"><span class="lbl">Std Dev</span><span class="val" id="statStd">—</span><span class="val-unit">units</span></div>
  </div>

  <div class="footnote">
    Brute-force enumeration of all <code>(n−1)!</code> tours.
    <a href="#" id="seedLink" title="Copy seed to clipboard">🎯</a>
  </div>
</div>

<script>
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  TSP Brute Force – Distance Histogram
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

const $ = id => document.getElementById(id);

const mapCanvas  = $('mapCanvas');
const mapCtx     = mapCanvas.getContext('2d');
const chartCanvas= $('chartCanvas');

let cities    = [];
let distances = [];   // all tour distances
let bestRoute = [];   // indices of the optimal tour (starting at 0)
let bestDist  = Infinity;
let chart     = null;

const COLORS = [
  '#38bdf8','#f472b6','#4ade80','#fbbf24','#a78bfa',
  '#fb923c','#2dd4bf','#f87171','#e879f9','#34d399'
];

// ── helpers ────────────────────────────────────────

function dist(a, b) {
  return Math.hypot(a.x - b.x, a.y - b.y);
}

function tourDistance(route) {
  let d = 0;
  for (let i = 0; i < route.length; i++) {
    d += dist(cities[route[i]], cities[route[(i + 1) % route.length]]);
  }
  return d;
}

function rand(min, max) { return Math.random() * (max - min) + min; }

// ── generate cities ────────────────────────────────

function generateCities(n, seed) {
  // Simple seeded PRNG (mulberry32) for reproducible randomness
  let s = seed >>> 0;
  function next() {
    s |= 0; s = s + 0x6D2B79F5 | 0;
    let t = Math.imul(s ^ s >>> 15, 1 | s);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  }

  const rng = seed != null ? next : Math.random;
  const pts = [];
  const margin = 40, area = 320;
  for (let i = 0; i < n; i++) {
    pts.push({ x: margin + rng() * area, y: margin + rng() * area });
  }
  return pts;
}

// ── brute-force TSP (all permutations of cities[1..n-1]) ──

function solveTSP() {
  const n = cities.length;
  if (n < 3) return;

  const indices = Array.from({ length: n - 1 }, (_, i) => i + 1); // [1, 2, …, n-1]
  const dists = [];
  let best = Infinity, bestR = null;

  function permute(arr, start) {
    if (start === arr.length) {
      const route = [0, ...arr];
      const d = tourDistance(route);
      dists.push(d);
      if (d < best) { best = d; bestR = [...route]; }
      return;
    }
    for (let i = start; i < arr.length; i++) {
      [arr[start], arr[i]] = [arr[i], arr[start]];
      permute(arr, start + 1);
      [arr[start], arr[i]] = [arr[i], arr[start]];
    }
  }

  permute(indices, 0);
  distances = dists;
  bestDist  = best;
  bestRoute = bestR;
}

// ── draw map ───────────────────────────────────────

function drawMap() {
  const w = mapCanvas.width, h = mapCanvas.height;
  mapCtx.clearRect(0, 0, w, h);

  // background
  mapCtx.fillStyle = '#0b1120';
  mapCtx.fillRect(0, 0, w, h);

  if (cities.length === 0) return;

  // Draw all possible edges (faded) to show the complete graph
  mapCtx.strokeStyle = 'rgba(71,85,105,0.2)';
  mapCtx.lineWidth = 1;
  for (let i = 0; i < cities.length; i++) {
    for (let j = i + 1; j < cities.length; j++) {
      mapCtx.beginPath();
      mapCtx.moveTo(cities[i].x, cities[i].y);
      mapCtx.lineTo(cities[j].x, cities[j].y);
      mapCtx.stroke();
    }
  }

  // Draw optimal tour
  if (bestRoute && bestRoute.length >= 3) {
    mapCtx.strokeStyle = '#4ade80';
    mapCtx.lineWidth = 2.5;
    mapCtx.shadowColor = 'rgba(74,222,128,0.25)';
    mapCtx.shadowBlur = 6;
    mapCtx.beginPath();
    mapCtx.moveTo(cities[bestRoute[0]].x, cities[bestRoute[0]].y);
    for (let i = 1; i < bestRoute.length; i++) {
      mapCtx.lineTo(cities[bestRoute[i]].x, cities[bestRoute[i]].y);
    }
    mapCtx.closePath();
    mapCtx.stroke();
    mapCtx.shadowBlur = 0;
  }

  // Draw cities
  for (let i = 0; i < cities.length; i++) {
    const { x, y } = cities[i];
    const color = COLORS[i % COLORS.length];

    // glow
    mapCtx.beginPath();
    mapCtx.arc(x, y, 10, 0, Math.PI * 2);
    mapCtx.fillStyle = color + '25';
    mapCtx.fill();

    // circle
    mapCtx.beginPath();
    mapCtx.arc(x, y, 7, 0, Math.PI * 2);
    mapCtx.fillStyle = color;
    mapCtx.fill();
    mapCtx.strokeStyle = '#0f172a';
    mapCtx.lineWidth = 2;
    mapCtx.stroke();

    // label
    mapCtx.fillStyle = '#f1f5f9';
    mapCtx.font = 'bold 11px system-ui, sans-serif';
    mapCtx.textAlign = 'center';
    mapCtx.textBaseline = 'bottom';
    mapCtx.fillText(i.toString(), x, y - 10);
  }
}

// ── histogram ──────────────────────────────────────

function buildHistogram() {
  if (distances.length === 0) return;

  const n = distances.length;
  const min = Math.min(...distances);
  const max = Math.max(...distances);

  // Number of bins: Sturges' rule
  const numBins = Math.max(8, Math.ceil(Math.log2(n) + 1));
  const binWidth = (max - min) / numBins || 1;

  const bins = Array(numBins).fill(0);
  const binLabels = [];
  for (let i = 0; i < numBins; i++) {
    binLabels.push((min + i * binWidth).toFixed(1));
  }

  for (const d of distances) {
    let idx = Math.floor((d - min) / binWidth);
    if (idx >= numBins) idx = numBins - 1;
    bins[idx]++;
  }

  // Chart.js
  if (chart) { chart.destroy(); chart = null; }

  const ctx = chartCanvas.getContext('2d');
  chart = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: binLabels,
      datasets: [{
        label: 'Tour count',
        data: bins,
        backgroundColor: '#38bdf880',
        borderColor: '#38bdf8',
        borderWidth: 1,
        borderRadius: 2,
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: '#1e293b',
          titleColor: '#f1f5f9',
          bodyColor: '#94a3b8',
          borderColor: '#475569',
          borderWidth: 1,
          padding: 10,
          callbacks: {
            title(items) {
              const i = items[0].dataIndex;
              const lo = (min + i * binWidth).toFixed(1);
              const hi = (min + (i + 1) * binWidth).toFixed(1);
              return `${lo} – ${hi}`;
            },
            label(ctx) {
              return ` ${ctx.parsed.y} tour${ctx.parsed.y === 1 ? '' : 's'}`;
            }
          }
        }
      },
      scales: {
        x: {
          title: { display: true, text: 'Tour distance', color: '#94a3b8', font: { size: 11 } },
          ticks: {
            color: '#64748b',
            font: { size: 9 },
            maxRotation: 45,
            autoSkip: true,
            maxTicksLimit: 20,
          },
          grid: { color: 'rgba(71,85,105,0.2)' }
        },
        y: {
          title: { display: true, text: 'Frequency', color: '#94a3b8', font: { size: 11 } },
          ticks: {
            color: '#64748b',
            font: { size: 9 },
            precision: 0,
          },
          grid: { color: 'rgba(71,85,105,0.2)' }
        }
      }
    }
  });
}

// ── stats ──────────────────────────────────────────

function updateStats() {
  if (distances.length === 0) {
    $('statCount').textContent = '—';
    $('statMin').textContent = '—';
    $('statMax').textContent = '—';
    $('statMean').textContent = '—';
    $('statMedian').textContent = '—';
    $('statStd').textContent = '—';
    return;
  }

  const n = distances.length;
  const sorted = [...distances].sort((a, b) => a - b);
  const min = sorted[0];
  const max = sorted[n - 1];
  const mean = sorted.reduce((s, v) => s + v, 0) / n;
  const median = n % 2 === 0
    ? (sorted[n / 2 - 1] + sorted[n / 2]) / 2
    : sorted[Math.floor(n / 2)];
  const variance = sorted.reduce((s, v) => s + (v - mean) ** 2, 0) / n;
  const std = Math.sqrt(variance);

  const f = v => v.toFixed(1);

  $('statCount').textContent = n.toLocaleString();
  $('statMin').textContent = f(min);
  $('statMax').textContent = f(max);
  $('statMean').textContent = f(mean);
  $('statMedian').textContent = f(median);
  $('statStd').textContent = f(std);
}

// ── main solve & render ────────────────────────────

function solveAndRender() {
  const n = cities.length;
  if (n < 3) return;

  const t0 = performance.now();
  solveTSP();
  const elapsed = (performance.now() - t0).toFixed(0);

  drawMap();
  buildHistogram();
  updateStats();

  $('statusMsg').innerHTML =
    `✅ Solved ${distances.length.toLocaleString()} tours in ${elapsed}ms`;
}

// ── init / regenerate ──────────────────────────────

let currentSeed = Date.now();

function init(seed) {
  currentSeed = seed || (Math.random() * 2**32 >>> 0);
  const n = +$('citySlider').value;
  $('cityVal').textContent = n;
  cities = generateCities(n, currentSeed);
  $('statusMsg').textContent = '⏳ Solving…';
  // Defer to let the status message render
  setTimeout(solveAndRender, 20);
}

// ── events ─────────────────────────────────────────

$('citySlider').addEventListener('input', () => {
  $('cityVal').textContent = $('citySlider').value;
});

$('solveBtn').addEventListener('click', () => {
  const n = +$('citySlider').value;
  $('cityVal').textContent = n;
  cities = generateCities(n, Math.random() * 2**32 >>> 0);
  $('statusMsg').textContent = '⏳ Solving…';
  setTimeout(solveAndRender, 20);
});

$('randomBtn').addEventListener('click', () => {
  currentSeed = Math.random() * 2**32 >>> 0;
  init(currentSeed);
});

$('seedLink').addEventListener('click', (e) => {
  e.preventDefault();
  navigator.clipboard.writeText(currentSeed.toString()).catch(() => {});
});

// Resize handler for chart aspect
let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { if (chart) chart.resize(); }, 150);
});

// ── start ──────────────────────────────────────────

init(currentSeed);
</script>
</body>
</html>
