[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "full-auto-de-pdf"
dynamic = ["version"]
description = "Scanned PDF to EPUB conversion toolkit"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Calvin Loveland" }]
dependencies = ["rapidfuzz>=3.10.0", "pillow>=10.0.0"]

[project.scripts]
full-auto-de-pdf = "full_auto_de_pdf.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]
ocr = ["paddleocr>=2.8.1"]

[tool.hatch.version]
path = "src/full_auto_de_pdf/__about__.py"

[tool.hatch.build]
include = ["/src"]

[tool.hatch.build.targets.wheel]
packages = ["src/full_auto_de_pdf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
