[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "full-auto-de-pdf"
dynamic = ["version"]
description = "Scanned PDF to EPUB conversion toolkit"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Calvin Loveland" }]
dependencies = ["rapidfuzz>=3.10.0", "pillow>=10.0.0"]

[project.scripts]
full-auto-de-pdf = "full_auto_de_pdf.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]
ocr = [
    "paddleocr>=3.0.0",
    "paddlepaddle>=3.2.0,<3.3.0",
    "opencv-python-headless>=4.10.0.84",
]

[tool.hatch.version]
path = "src/full_auto_de_pdf/__about__.py"

[tool.hatch.build]
include = ["/src"]

[tool.hatch.build.targets.wheel]
packages = ["src/full_auto_de_pdf"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pylint.main]
ignore-paths = ["(^|.*/)tests/.*"]

[tool.pylint.format]
max-line-length = 160
max-module-lines = 2200

[tool.pylint.design]
max-args = 14
max-attributes = 12
max-locals = 30
max-positional-arguments = 8

[tool.full-auto-ci.lizard]
max_ccn = 26
