[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bandcamp-matcher"
version = "0.1.0"
description = "Cross-reference a Spotify export CSV against Bandcamp — find which tracks are available for legal DRM-free download."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Calvin Loveland", email = "calvin@loveland.dev" },
]
keywords = ["bandcamp", "spotify", "export", "music", "downloader"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio",
  "Topic :: Utilities",
]
dependencies = [
  "requests>=2.28",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "pytest-cov>=4.0",
  "responses>=0.23",
]

[project.scripts]
bandcamp-matcher = "bandcamp_matcher.cli:main"

[project.urls]
"Source" = "https://github.com/calvinloveland/megarepo/tree/main/active/dev-tools/bandcamp-matcher"

[tool.hatch.build.targets.wheel]
packages = ["src/bandcamp_matcher"]

[tool.hatch.version]
path = "src/bandcamp_matcher/__init__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"
