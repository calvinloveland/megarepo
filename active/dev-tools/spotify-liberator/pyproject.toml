[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spotify-liberator"
version = "0.1.0"
description = "Export your Spotify Liked Songs and playlists to portable, open formats — your music, your data, no lock-in."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Calvin Loveland", email = "calvin@loveland.dev" },
]
keywords = ["spotify", "export", "data-liberation", "playlist", "liked-songs"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Sound/Audio",
  "Topic :: Utilities",
]
dependencies = [
  "requests>=2.28",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "pytest-cov>=4.0",
  "responses>=0.23",  # mocks requests
]
m3u = [
  # Future: nicer M3U8 with extended metadata
]

[project.scripts]
spotify-liberator = "spotify_liberator.cli:main"

[project.urls]
"Source" = "https://github.com/calvinloveland/megarepo/tree/main/active/dev-tools/spotify-liberator"
"Issues" = "https://github.com/calvinloveland/megarepo/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/spotify_liberator"]

[tool.hatch.version]
path = "src/spotify_liberator/__init__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"
