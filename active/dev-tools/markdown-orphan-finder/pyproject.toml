[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "markdown-orphan-finder"
version = "0.2.0"
description = "Find orphaned markdown files and isolated islands in a repository"
authors = [{ name = "Calvin Loveland", email = "calvin@loveland.dev" }]
license = { text = "MIT" }
requires-python = ">=3.8"

[project.scripts]
find-orphans = "find_orphans:main"
