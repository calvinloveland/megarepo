<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LUC Link Explorer</title>
<style>
  :root {
    --bg: #101418; --panel: #161d24; --panel2: #1c2530; --border: #2a3644;
    --text: #d7e0ea; --dim: #7d8b99; --accent: #4fc3f7;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.45 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  header {
    padding: 14px 20px; border-bottom: 1px solid var(--border);
    display: flex; flex-wrap: wrap; gap: 14px; align-items: center;
  }
  header h1 { font-size: 17px; margin: 0; letter-spacing: .5px; }
  header .sub { color: var(--dim); font-size: 12px; margin-left: 6px; }
  .controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-left: auto; }
  .controls label { color: var(--dim); font-size: 12px; display: flex; align-items: center; gap: 5px; }
  .controls select, .controls input[type=number] {
    background: var(--panel2); color: var(--text); border: 1px solid var(--border);
    border-radius: 4px; padding: 4px 6px; font: inherit; font-size: 13px;
  }
  button {
    background: var(--accent); color: #0a1a24; border: 0; border-radius: 4px;
    padding: 6px 14px; font: inherit; font-weight: 600; cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: wait; }
  main { padding: 16px 20px; max-width: 1200px; margin: 0 auto; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 16px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px; }
  .card .k { color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: .8px; }
  .card .v { font-size: 22px; font-weight: 700; margin-top: 4px; }
  .card .v small { font-size: 12px; color: var(--dim); font-weight: 400; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 12px; margin-bottom: 16px; }
  .panel h2 { font-size: 13px; margin: 0 0 8px; color: var(--accent); text-transform: uppercase; letter-spacing: 1px; }
  canvas { width: 100%; height: auto; display: block; background: var(--panel2); border-radius: 4px; }
  .legend { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px; font-size: 12px; color: var(--dim); }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .swatch { width: 11px; height: 11px; border-radius: 2px; display: inline-block; }
  .tooltip {
    position: fixed; pointer-events: none; background: #0a0e12; border: 1px solid var(--border);
    border-radius: 4px; padding: 6px 8px; font-size: 12px; display: none; z-index: 10;
    white-space: pre; box-shadow: 0 4px 12px rgba(0,0,0,.5);
  }
  #status { color: var(--dim); font-size: 12px; margin: 6px 2px; }
  .muted { color: var(--dim); }
</style>
</head>
<body>
<header>
  <h1>LUC Link Explorer <span class="sub">DARPA Lightweight Universal Codec · simulator</span></h1>
  <div class="controls">
    <label>scenario <select id="scenario"><option value="gentle">gentle</option><option value="harsh">harsh</option></select></label>
    <label>mission <select id="mission"><option>throughput</option><option>latency</option><option>robust</option></select></label>
    <label>frames <input id="frames" type="number" value="600" min="100" max="2000" step="100"></label>
    <label>seed <input id="seed" type="number" value="7"></label>
    <label><input id="adaptive" type="checkbox" checked> adaptive</label>
    <button id="run">Run link</button>
  </div>
</header>
<main>
  <div class="cards" id="cards"></div>
  <div class="panel">
    <h2>Adaptive link timeline</h2>
    <canvas id="timeline" width="1200" height="420"></canvas>
    <div class="legend" id="legend"></div>
  </div>
  <div class="panel">
    <h2>BLER vs Eb/N0 — all code families, one GRAND decoder</h2>
    <canvas id="curves" width="1200" height="420"></canvas>
    <div id="status"></div>
  </div>
</main>
<div class="tooltip" id="tooltip"></div>

<script>
"use strict";
const FAMILY_COLORS = {
  "repetition": "#9ecae1", "hamming": "#a6d854", "bch": "#e78ac3",
  "reed-solomon": "#ffd92f", "polar": "#fc8d62", "ldpc": "#66c2a5",
  "turbo": "#8da0cb", "(outage)": "#4a5560",
};
const DPR = window.devicePixelRatio || 1;

const $ = (id) => document.getElementById(id);
const tooltip = $("tooltip");

function setupCanvas(canvas) {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if (canvas.width !== Math.round(w * DPR) || canvas.height !== Math.round(h * DPR)) {
    canvas.width = Math.round(w * DPR);
    canvas.height = Math.round(h * DPR);
  }
  const ctx = canvas.getContext("2d");
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, w, h);
  return { ctx, w, h };
}

/* ---------------- timeline ---------------- */
let simData = null;

function familyColor(f) { return FAMILY_COLORS[f] || "#888"; }

function drawTimeline() {
  const canvas = $("timeline");
  const { ctx, w, h } = setupCanvas(canvas);
  if (!simData) return;
  const recs = simData.records;
  const n = recs.length;
  const padL = 56, padR = 16, padT = 14, padB = 22;
  const plotW = w - padL - padR;
  const snrH = (h - padT - padB) * 0.58;
  const bandTop = padT + snrH + 8;

  // SNR panel
  const allSnr = recs.flatMap(r => [r.true_snr_db, r.est_snr_db]);
  const lo = Math.floor(Math.min(...allSnr)) - 1;
  const hi = Math.ceil(Math.max(...allSnr)) + 1;
  const sx = (i) => padL + (i / (n - 1 || 1)) * plotW;
  const sy = (v) => padT + (1 - (v - lo) / (hi - lo)) * snrH;

  ctx.font = "11px monospace"; ctx.fillStyle = "#7d8b99";
  for (let v = lo; v <= hi; v++) {
    if (v % 2 === 0 || v === lo || v === hi) {
      const y = sy(v);
      ctx.strokeStyle = "#22303c"; ctx.beginPath();
      ctx.moveTo(padL, y); ctx.lineTo(padL + plotW, y); ctx.stroke();
      ctx.fillText(v + "", padL - 6, y + 4);
    }
  }

  // true SNR (thin) and estimated SNR (thick)
  ctx.beginPath();
  recs.forEach((r, i) => i ? ctx.lineTo(sx(i), sy(r.true_snr_db)) : ctx.moveTo(sx(i), sy(r.true_snr_db)));
  ctx.strokeStyle = "#e15759"; ctx.lineWidth = 1.2; ctx.stroke();
  ctx.beginPath();
  recs.forEach((r, i) => i ? ctx.lineTo(sx(i), sy(r.est_snr_db)) : ctx.moveTo(sx(i), sy(r.est_snr_db)));
  ctx.strokeStyle = "#4fc3f7"; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = "#e15759"; ctx.fillText("true SNR", padL + 6, padT + 10);
  ctx.fillStyle = "#4fc3f7"; ctx.fillText("est. SNR", padL + 6, padT + 22);

  // code-selection band
  const bandH = h - padT - snrH - 8 - padB;
  const byFamily = {};
  recs.forEach(r => { byFamily[r.family] = (byFamily[r.family] || 0) + 1; });
  const cellW = plotW / n;
  recs.forEach((r, i) => {
    ctx.fillStyle = familyColor(r.family);
    ctx.fillRect(padL + i * cellW, bandTop, Math.max(cellW - 0.5, 0.7), bandH);
  });
  ctx.fillStyle = "#7d8b99";
  ctx.font = "10px monospace";
  let lx = padL + 6, ly = bandTop + 9;
  for (const [f, c] of Object.entries(byFamily)) {
    ctx.fillStyle = familyColor(f);
    ctx.fillRect(lx, ly - 7, 9, 9);
    ctx.fillStyle = "#9aa8b6";
    ctx.fillText(f + " " + c, lx + 12, ly);
    lx += 14 + ctx.measureText(f + " " + c).width + 12;
  }

  // switch markers
  ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 1;
  ctx.setLineDash([3, 3]);
  simData.switches.forEach(s => {
    const x = sx(s.t);
    ctx.beginPath(); ctx.moveTo(x, bandTop - 4); ctx.lineTo(x, bandTop + bandH); ctx.stroke();
  });
  ctx.setLineDash([]);

  // error / outage markers
  recs.forEach((r, i) => {
    const x = padL + i * cellW + cellW / 2;
    if (r.outage) { ctx.fillStyle = "#c0392b"; ctx.fillRect(x, bandTop + bandH - 3, 2, 3); }
    else if (!r.ok) { ctx.fillStyle = "#ff6b6b"; ctx.fillRect(x, bandTop + bandH - 5, 2, 5); }
  });

  // frame axis
  ctx.fillStyle = "#7d8b99";
  const step = Math.max(1, Math.round(n / 10));
  for (let t = 0; t < n; t += step) {
    ctx.fillText(t + "", sx(t) - 10, h - 8);
  }
  ctx.fillStyle = "#9aa8b6";
  ctx.fillText("frame →", padL + plotW - 52, h - 8);

  // hover interaction
  canvas.onmousemove = (ev) => {
    const rect = canvas.getBoundingClientRect();
    const mx = ev.clientX - rect.left;
    const idx = Math.round((mx - padL) / plotW * (n - 1));
    if (idx < 0 || idx >= n) { tooltip.style.display = "none"; return; }
    const r = recs[idx];
    tooltip.textContent =
      `frame ${r.t}  true ${r.true_snr_db} dB  est ${r.est_snr_db} dB\n` +
      `code ${r.code_name} (${r.family})\nqueries ${r.queries}  info_bits ${r.info_bits}\n` +
      `${r.outage ? "SYNC LOSS" : (r.ok ? "OK" : "ERROR")}`;
    tooltip.style.display = "block";
    tooltip.style.left = (ev.clientX + 14) + "px";
    tooltip.style.top = (ev.clientY - 10) + "px";
  };
  canvas.onmouseleave = () => { tooltip.style.display = "none"; };
}

/* ---------------- curves ---------------- */
function drawCurves(data) {
  const canvas = $("curves");
  const { ctx, w, h } = setupCanvas(canvas);
  const padL = 64, padR = 16, padT = 14, padB = 26;
  const plotW = w - padL - padR, plotH = h - padT - padB;
  const xs = data.snr_points;
  const xmin = Math.min(...xs), xmax = Math.max(...xs);
  const ymin = 1e-3, ymax = 1;

  const sx = (x) => padL + (x - xmin) / (xmax - xmin) * plotW;
  const sy = (y) => padT + (Math.log10(ymax) - Math.log10(Math.max(y, 1e-9))) /
    (Math.log10(ymax) - Math.log10(ymin)) * plotH;

  ctx.font = "11px monospace"; ctx.fillStyle = "#7d8b99";
  for (let d = -3; d <= 0; d++) {
    const y = 10 ** d;
    const yy = sy(y);
    ctx.strokeStyle = "#22303c"; ctx.beginPath();
    ctx.moveTo(padL, yy); ctx.lineTo(padL + plotW, yy); ctx.stroke();
    ctx.fillText((10 ** d).toExponential(0), padL - 6, yy + 4);
  }
  for (let x = xmin; x <= xmax; x += 2) {
    ctx.fillText(x + "", sx(x) - 6, h - 10);
  }
  ctx.fillStyle = "#9aa8b6";
  ctx.fillText("Eb/N0 (dB) →", padL + plotW - 74, h - 10);

  // target line
  const ty = sy(data.target_bler);
  ctx.strokeStyle = "#e15759"; ctx.setLineDash([5, 4]);
  ctx.beginPath(); ctx.moveTo(padL, ty); ctx.lineTo(padL + plotW, ty); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = "#e15759";
  ctx.fillText("target " + data.target_bler, padL + 4, ty - 4);

  for (const [name, entry] of Object.entries(data.curves)) {
    ctx.beginPath();
    entry.points.forEach(([x, y], i) => i ? ctx.lineTo(sx(x), sy(y)) : ctx.moveTo(sx(x), sy(y)));
    ctx.strokeStyle = familyColor(entry.family);
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }
}

/* ---------------- stats + legend ---------------- */
function renderStats() {
  const s = simData.stats;
  const lat = s.switch_latency_ms;
  const cards = [
    ["BLER", s.bler.toFixed(4), ""],
    ["Goodput", s.goodput.toFixed(4), "info bits / tx bit"],
    ["Outage", s.outage.toFixed(4), ""],
    ["Switches", s.switches, ""],
    ["Switch latency", lat.median == null ? "—" : lat.median + " ms", "median (max " + (lat.max ?? "—") + ")"],
    ["Avg queries", s.avg_queries.toFixed(1), "/ frame"],
    ["q / info bit", s.queries_per_info_bit.toFixed(2), ""],
  ];
  $("cards").innerHTML = cards.map(([k, v, u]) =>
    `<div class="card"><div class="k">${k}</div><div class="v">${v} <small>${u}</small></div></div>`
  ).join("");
}

function renderLegend(codes) {
  const fams = [...new Set(codes.map(c => c.family))];
  $("legend").innerHTML = fams.map(f =>
    `<span><span class="swatch" style="background:${familyColor(f)}"></span>${f}</span>`
  ).join("") +
    `<span><span class="swatch" style="background:#fff"></span>switch</span>` +
    `<span><span class="swatch" style="background:#ff6b6b"></span>error</span>` +
    `<span><span class="swatch" style="background:#c0392b"></span>sync loss</span>`;
}

/* ---------------- data loading ---------------- */
async function fetchJSON(url) {
  const res = await fetch(url);
  const data = await res.json();
  if (data.error) throw new Error(data.error);
  return data;
}

async function run() {
  const runBtn = $("run");
  runBtn.disabled = true;
  $("status").textContent = "running link simulation…";
  const q = new URLSearchParams({
    frames: $("frames").value, seed: $("seed").value,
    mission: $("mission").value, scenario: $("scenario").value,
    adaptive: $("adaptive").checked ? "1" : "0",
  });
  try {
    const t0 = performance.now();
    simData = await fetchJSON("/api/sim?" + q.toString());
    $("status").textContent =
      `link complete in ${((performance.now() - t0) / 1000).toFixed(1)} s` +
      ` · mission=${simData.meta.mission} adaptive=${simData.meta.adaptive} · ` +
      Object.entries(simData.stats.usage).map(([k, v]) => `${k}=${v}`).join(", ");
    renderStats();
    drawTimeline();
  } catch (err) {
    $("status").textContent = "error: " + err.message;
  } finally {
    runBtn.disabled = false;
  }
}

async function loadCurves() {
  const q = new URLSearchParams({ snr: "0,2,4,6,8,10,12", frames: "300" });
  try {
    const data = await fetchJSON("/api/curves?" + q.toString());
    drawCurves(data);
  } catch (err) {
    $("status").textContent = "curves error: " + err.message;
  }
}

(async function init() {
  try {
    const codes = await fetchJSON("/api/codes");
    renderLegend(codes.codes);
  } catch (e) { /* legend optional */ }
  await loadCurves();
  await run();
  $("run").addEventListener("click", run);
})();
</script>
</body>
</html>
