[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "luc-sim"
version = "0.1.0"
description = "Simulator and prototype implementation for the DARPA Lightweight Universal Codec (LUC) concept: a GRAND-style universal error-correcting codec with adaptive, on-the-fly code-class switching."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0.0"]

[project.scripts]
luc-sim = "luc_sim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
