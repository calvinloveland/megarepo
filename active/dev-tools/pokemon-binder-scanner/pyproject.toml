[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pokemon-binder-scanner"
version = "0.1.0"
description = "Starter tooling for scanning and pricing whole Pokémon binders"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "Flask>=3.0",
  "numpy>=1.26",
  "opencv-contrib-python>=4.10.0.84",
  "Pillow>=10.0",
  "scikit-image>=0.22",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = []

[project.scripts]
pokemon-binder-scanner = "pokemon_binder_scanner.cli:main"
pokemon-binder-scanner-web = "pokemon_binder_scanner.webapp:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
