[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "manifold-trading-framework"
version = "0.1.0"
description = "Manifold trading framework built on top of the reusable TCI framework"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
manifold-trading-framework = "manifold_trading_framework.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../../dev-tools/tci-framework/src"]
