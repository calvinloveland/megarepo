apiVersion: v1
kind: Namespace
metadata:
  name: openclaw
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openclaw-data
  namespace: openclaw
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openclaw
  namespace: openclaw
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openclaw
  template:
    metadata:
      labels:
        app: openclaw
    spec:
      tolerations:
        - key: node.kubernetes.io/disk-pressure
          operator: Exists
          effect: NoSchedule
      containers:
        - name: openclaw
          image: node:24-bookworm-slim
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - |
              export HOME=/data/home
              export TMPDIR=/data/tmp
              export NPM_CONFIG_PREFIX=/data/npm
              export NPM_CONFIG_CACHE=/data/npm-cache
              export PATH="$NPM_CONFIG_PREFIX/bin:$PATH"
              export OPENCLAW_STATE_DIR=/data/.openclaw
              export OPENCLAW_WORKSPACE_DIR=/data/workspace

              mkdir -p \
                "$HOME" \
                "$TMPDIR" \
                "$NPM_CONFIG_PREFIX" \
                "$NPM_CONFIG_CACHE" \
                "$OPENCLAW_STATE_DIR" \
                "$OPENCLAW_WORKSPACE_DIR"

              if [ ! -x "$NPM_CONFIG_PREFIX/bin/openclaw" ]; then
                npm install -g "openclaw@2026.3.24"
              fi

              if [ ! -x /usr/bin/chromium ]; then
                apt-get update -qq
                apt-get install -y --no-install-recommends chromium
                rm -rf /var/lib/apt/lists/*
              fi

              cat > "$OPENCLAW_STATE_DIR/openclaw.json" <<'JSON'
              {
                "agents": {
                  "defaults": {
                    "model": {
                      "primary": "openrouter/free"
                    },
                    "models": {
                      "openrouter/free": {}
                    }
                  }
                },
                "gateway": {
                  "mode": "local",
                  "controlUi": {
                    "allowedOrigins": [
                      "http://127.0.0.1:18789",
                      "http://localhost:18789",
                      "https://thinker-openclaw.tail876a6b.ts.net:8443"
                    ]
                  }
                },
                "hooks": {
                  "enabled": true,
                  "token": "${OPENCLAW_HOOKS_TOKEN}",
                  "path": "/hooks",
                  "presets": ["gmail"],
                  "defaultSessionKey": "hook:gmail"
                },
                "channels": {
                  "telegram": {
                    "enabled": true,
                    "botToken": "${OPENCLAW_TELEGRAM_BOT_TOKEN}",
                    "dmPolicy": "pairing"
                  }
                }
              }
              JSON

              openclaw config set browser.executablePath /usr/bin/chromium
              openclaw config set browser.headless true
              openclaw config set browser.noSandbox true
              openclaw config set browser.defaultProfile openclaw

              exec openclaw gateway --allow-unconfigured --auth token --bind lan --port 18789 --token "$OPENCLAW_GATEWAY_TOKEN"
          env:
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: openclaw-env
                  key: openrouter-api-key
            - name: OPENCLAW_GATEWAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: openclaw-env
                  key: gateway-token
            - name: OPENCLAW_TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: openclaw-env
                  key: telegram-bot-token
            - name: OPENCLAW_HOOKS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: openclaw-env
                  key: hooks-token
            - name: TZ
              value: UTC
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
              ephemeral-storage: 1Gi
            limits:
              memory: 2Gi
              ephemeral-storage: 4Gi
          ports:
            - name: http
              containerPort: 18789
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
          volumeMounts:
            - name: openclaw-data
              mountPath: /data
      volumes:
        - name: openclaw-data
          persistentVolumeClaim:
            claimName: openclaw-data
---
apiVersion: v1
kind: Service
metadata:
  name: openclaw
  namespace: openclaw
spec:
  selector:
    app: openclaw
  ports:
    - name: http
      port: 18789
      targetPort: http
