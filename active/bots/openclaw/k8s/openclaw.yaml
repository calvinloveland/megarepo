apiVersion: v1
kind: Namespace
metadata:
  name: openclaw
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openclaw-data
  namespace: openclaw
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openclaw
  namespace: openclaw
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openclaw
  template:
    metadata:
      labels:
        app: openclaw
    spec:
      tolerations:
        - key: node.kubernetes.io/disk-pressure
          operator: Exists
          effect: NoSchedule
      containers:
        - name: openclaw
          image: node:24-bookworm-slim
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - |
              export HOME=/data/home
              export TMPDIR=/data/tmp
              export NPM_CONFIG_PREFIX=/data/npm
              export NPM_CONFIG_CACHE=/data/npm-cache
              export PATH="$NPM_CONFIG_PREFIX/bin:$PATH"
              export HIMALAYA_PREFIX=/data/tools/himalaya
              export OPENCLAW_STATE_DIR=/data/.openclaw
              export OPENCLAW_WORKSPACE_DIR=/data/workspace

              mkdir -p \
                "$HOME" \
                "$TMPDIR" \
                "$NPM_CONFIG_PREFIX" \
                "$NPM_CONFIG_CACHE" \
                "$HIMALAYA_PREFIX" \
                "$OPENCLAW_STATE_DIR" \
                "$OPENCLAW_WORKSPACE_DIR"

              if [ ! -x "$NPM_CONFIG_PREFIX/bin/openclaw" ]; then
                npm install -g "openclaw@2026.3.24"
              fi

              if [ -n "${HIMALAYA_GMAIL_ADDRESS:-}" ] && [ -n "${HIMALAYA_GMAIL_APP_PASSWORD:-}" ]; then
                export PATH="$HIMALAYA_PREFIX/bin:$PATH"

                if [ ! -x "$HIMALAYA_PREFIX/bin/himalaya" ]; then
                  apt-get update -qq
                  apt-get install -y --no-install-recommends ca-certificates curl tar
                  arch="$(uname -m)"
                  case "$arch" in
                    x86_64) himalaya_target="x86_64-linux" ;;
                    aarch64|arm64) himalaya_target="aarch64-linux" ;;
                    *)
                      echo "unsupported himalaya architecture: $arch" >&2
                      exit 1
                      ;;
                  esac
                  curl -fsSL \
                    "https://github.com/pimalaya/himalaya/releases/latest/download/himalaya.${himalaya_target}.tgz" \
                    -o /tmp/himalaya.tgz
                  tar -xzf /tmp/himalaya.tgz -C /tmp
                  install -m 0755 /tmp/himalaya "$HIMALAYA_PREFIX/bin/himalaya"
                  rm -f /tmp/himalaya /tmp/himalaya.tgz
                fi

                mkdir -p "$HOME/.config/himalaya"
                cat > "$HOME/.config/himalaya/config.toml" <<EOF
                [accounts.gmail]
                email = "$HIMALAYA_GMAIL_ADDRESS"
                display-name = "$HIMALAYA_GMAIL_ADDRESS"
                default = true

                backend.type = "imap"
                backend.host = "imap.gmail.com"
                backend.port = 993
                backend.encryption.type = "tls"
                backend.login = "$HIMALAYA_GMAIL_ADDRESS"
                backend.auth.type = "password"
                backend.auth.cmd = "printf '%s' \"\$HIMALAYA_GMAIL_APP_PASSWORD\""

                message.send.backend.type = "smtp"
                message.send.backend.host = "smtp.gmail.com"
                message.send.backend.port = 587
                message.send.backend.encryption.type = "start-tls"
                message.send.backend.login = "$HIMALAYA_GMAIL_ADDRESS"
                message.send.backend.auth.type = "password"
                message.send.backend.auth.cmd = "printf '%s' \"\$HIMALAYA_GMAIL_APP_PASSWORD\""
                EOF
              fi

              cat > "$OPENCLAW_STATE_DIR/openclaw.json" <<'JSON'
              {
                "agents": {
                  "defaults": {
                    "model": {
                      "primary": "openrouter/free"
                    },
                    "models": {
                      "openrouter/free": {}
                    }
                  }
                },
                "gateway": {
                  "controlUi": {
                    "allowedOrigins": [
                      "http://127.0.0.1:18789",
                      "http://localhost:18789",
                      "https://thinker-openclaw.tail876a6b.ts.net"
                    ]
                  }
                },
                "channels": {
                  "telegram": {
                    "enabled": true,
                    "botToken": "${OPENCLAW_TELEGRAM_BOT_TOKEN}",
                    "dmPolicy": "pairing"
                  }
                }
              }
              JSON

              exec openclaw gateway --allow-unconfigured --auth token --bind lan --port 18789 --token "$OPENCLAW_GATEWAY_TOKEN"
          env:
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: openclaw-env
                  key: openrouter-api-key
            - name: OPENCLAW_GATEWAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: openclaw-env
                  key: gateway-token
            - name: OPENCLAW_TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: openclaw-env
                  key: telegram-bot-token
            - name: HIMALAYA_GMAIL_ADDRESS
              valueFrom:
                secretKeyRef:
                  name: openclaw-env
                  key: gmail-address
                  optional: true
            - name: HIMALAYA_GMAIL_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: openclaw-env
                  key: gmail-app-password
                  optional: true
            - name: TZ
              value: UTC
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
              ephemeral-storage: 1Gi
            limits:
              memory: 2Gi
              ephemeral-storage: 4Gi
          ports:
            - name: http
              containerPort: 18789
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
          volumeMounts:
            - name: openclaw-data
              mountPath: /data
      volumes:
        - name: openclaw-data
          persistentVolumeClaim:
            claimName: openclaw-data
---
apiVersion: v1
kind: Service
metadata:
  name: openclaw
  namespace: openclaw
spec:
  selector:
    app: openclaw
  ports:
    - name: http
      port: 18789
      targetPort: http
