apiVersion: v1
kind: Namespace
metadata:
  name: openclaw
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openclaw-data
  namespace: openclaw
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openclaw
  namespace: openclaw
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openclaw
  template:
    metadata:
      labels:
        app: openclaw
    spec:
      tolerations:
        - key: node.kubernetes.io/disk-pressure
          operator: Exists
          effect: NoSchedule
      containers:
        - name: openclaw
          image: node:24-bookworm-slim
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - |
              export HOME=/data/home
              export TMPDIR=/data/tmp
              export NPM_CONFIG_PREFIX=/data/npm
              export NPM_CONFIG_CACHE=/data/npm-cache
              export PATH="$NPM_CONFIG_PREFIX/bin:$PATH"
              export OPENCLAW_STATE_DIR=/data/.openclaw
              export OPENCLAW_WORKSPACE_DIR=/data/workspace

              mkdir -p \
                "$HOME" \
                "$TMPDIR" \
                "$NPM_CONFIG_PREFIX" \
                "$NPM_CONFIG_CACHE" \
                "$OPENCLAW_STATE_DIR" \
                "$OPENCLAW_WORKSPACE_DIR"

              mkdir -p "$HOME/.openclaw/workspace"

              if [ ! -x "$NPM_CONFIG_PREFIX/bin/openclaw" ]; then
                npm install -g "openclaw@2026.3.24"
              fi

              if [ -x /usr/bin/chromium ]; then
                BROWSER_EXECUTABLE=/usr/bin/chromium
              else
                apt-get update -qq
                apt-get install -y --no-install-recommends chromium
                rm -rf /var/lib/apt/lists/*
                BROWSER_EXECUTABLE=/usr/bin/chromium
              fi

              mkdir -p /data/.openclaw/browser/openclaw/user-data
              rm -f \
                /data/.openclaw/browser/openclaw/user-data/SingletonCookie \
                /data/.openclaw/browser/openclaw/user-data/SingletonLock \
                /data/.openclaw/browser/openclaw/user-data/SingletonSocket
              find /data/tmp -maxdepth 1 -type d -name 'org.chromium.Chromium.*' -exec rm -rf {} +

              cat > "$OPENCLAW_STATE_DIR/openclaw.json" <<'JSON'
              {
                "agents": {
                  "defaults": {
                    "model": {
                      "primary": "openrouter/free"
                    },
                    "models": {
                      "openrouter/free": {}
                    }
                  }
                },
                "gateway": {
                  "mode": "local",
                  "controlUi": {
                    "allowedOrigins": [
                      "http://127.0.0.1:18789",
                      "http://localhost:18789",
                      "https://thinker-openclaw.tail876a6b.ts.net:8443"
                    ]
                  }
                },
                "hooks": {
                  "enabled": true,
                  "token": "${OPENCLAW_HOOKS_TOKEN}",
                  "path": "/hooks",
                  "mappings": [
                    {
                      "id": "gmail-triage",
                      "match": {
                        "path": "gmail"
                      },
                      "action": "wake",
                      "wakeMode": "now",
                      "textTemplate": "Email triage event\\nFrom: {{messages[0].from}}\\nSubject: {{messages[0].subject}}\\nSnippet: {{messages[0].snippet}}\\nBody:\\n{{messages[0].body}}\\n\\nApply the inbox triage policy in HEARTBEAT.md. Do not automatically summarize every email to Calvin."
                    }
                  ]
                },
                "channels": {
                  "telegram": {
                    "enabled": true,
                    "botToken": "${OPENCLAW_TELEGRAM_BOT_TOKEN}",
                    "dmPolicy": "pairing"
                  }
                }
              }
              JSON

              cat > "$HOME/.openclaw/workspace/HEARTBEAT.md" <<'MD'
              # Gmail inbox triage policy

              Use heartbeat turns for inbox triage only. Do not use them for unrelated research, status chatter, or "heartbeat successful" messages.

              When a system event contains an incoming email:

              - Treat it as triage, not as a request to automatically message Calvin.
              - Only send Calvin a message if the email is important and likely needs attention or action.
              - Important/actionable usually includes real-person email, security alerts, bills or money movement, travel changes, deadlines, verification codes, account issues, school/work/medical matters, and anything time-sensitive or high-consequence.
              - For important emails that do not require action, append a short note to `memory/YYYY-MM-DD.md` (create the directory if needed), then reply `HEARTBEAT_OK`.
              - For routine promos, newsletters, marketing blasts, shopping recommendations, social digests, shipping ads, or low-signal automated notices, reply `HEARTBEAT_OK`.
              - Keep any user-facing alert brief: sender, subject, why it matters, and what action is needed.
              - Never mention HEARTBEAT.md, heartbeat policy, internal tasks, or "manual triage" in a user-facing alert.
              - Stay quiet overnight unless the email is urgent or time-sensitive.
              MD

              cat > "$HOME/.openclaw/workspace/GMAIL_READONLY_SETUP.md" <<'MD'
              # Gmail access for this deployment

              This OpenClaw deployment uses the secure Gmail Pub/Sub + OAuth `gmail.readonly` flow on `thinker`.

              - The watcher runs outside the pod with `gog gmail watch serve`.
              - New-mail events are posted to `/hooks/gmail`.
              - The gateway triages inbox events through `HEARTBEAT.md`.
              - Do not switch this deployment back to IMAP or Gmail app passwords.
              MD

              openclaw config set browser.executablePath "$BROWSER_EXECUTABLE"
              openclaw config set browser.headless true
              openclaw config set browser.noSandbox true
              openclaw config set browser.defaultProfile openclaw
              openclaw models set openrouter/free
              openclaw models fallbacks clear
              openclaw models fallbacks add github-copilot/gpt-4.1

              exec openclaw gateway --allow-unconfigured --auth token --bind lan --port 18789 --token "$OPENCLAW_GATEWAY_TOKEN"
          env:
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: openclaw-env
                  key: openrouter-api-key
            - name: OPENCLAW_GATEWAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: openclaw-env
                  key: gateway-token
            - name: OPENCLAW_TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: openclaw-env
                  key: telegram-bot-token
            - name: OPENCLAW_HOOKS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: openclaw-env
                  key: hooks-token
            - name: TZ
              value: UTC
          resources:
            requests:
              cpu: 100m
              memory: 768Mi
              ephemeral-storage: 1Gi
            limits:
              memory: 3Gi
              ephemeral-storage: 4Gi
          ports:
            - name: http
              containerPort: 18789
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
          volumeMounts:
            - name: openclaw-data
              mountPath: /data
      volumes:
        - name: openclaw-data
          persistentVolumeClaim:
            claimName: openclaw-data
---
apiVersion: v1
kind: Service
metadata:
  name: openclaw
  namespace: openclaw
spec:
  selector:
    app: openclaw
  ports:
    - name: http
      port: 18789
      targetPort: http
